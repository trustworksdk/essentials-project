# Configuration for EssentialsConstructionErgonomicsTest's FreezingArchRule guard.
#
# The construction-ergonomics rules (no Optional constructor parameters, five-parameter ceiling) are not satisfied by
# the current tree — converting the classes in scope is a multi-phase effort tracked in
# docs/constructor-ergonomics-and-optional-policy.md. Freezing lets the guard land now: today's violations are
# recorded in the checked-in store below and tolerated, while any NEW violation fails the build.
#
# This starter's classpath is a superset of eventsourced-aggregates' and spring-boot-starter-postgresql's, so this
# store duplicates most of theirs. That is deliberate: allowStoreUpdate removes a violation from every store that
# holds it once it is fixed, whereas restricting the import to "the packages nobody else covers" is a mapping that
# rots the moment a dependency moves. What only this classpath reaches is spring-postgresql-event-store and this
# module's own auto-configuration.
#
# Store location, relative to the module directory. Checked into git on purpose: the file is the progress metric for
# the sweep, and a diff that removes lines from it is the evidence a phase actually converted something.
freeze.store.default.path=archunit_store

# Create the store on first run (it is committed afterwards).
freeze.store.default.allowStoreCreation=true

# Remove violations from the store once they are fixed, so the store cannot silently keep tolerating a rule that is
# already satisfied. This never ADDS violations — a new one fails the test.
freeze.store.default.allowStoreUpdate=true

# Never blanket-accept the current state. Set this to true only for a deliberate, reviewed re-baseline
# (mvn test -pl components/spring-boot-starter-postgresql-event-store -Darchunit.freeze.refreeze=true), never as a way
# past a red build.
freeze.refreeze=false
