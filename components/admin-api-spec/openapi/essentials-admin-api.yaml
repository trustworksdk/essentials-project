components:
  schemas:
    ApiCdcAvailability:
      required:
      - fallbackCount
      - lastChangedEpochMs
      type: object
      properties:
        state:
          type: string
        slotName:
          type: string
        reason:
          type: string
        lastChangedEpochMs:
          type: integer
          format: int64
        fallbackCount:
          type: integer
          format: int64
    ApiCdcConfiguration:
      required:
      - cdcEventStoreBackfillBatchSize
      - dispatcherBatchSize
      - enabled
      - inboxTtlDuration
      type: object
      properties:
        enabled:
          type: boolean
        mode:
          type: string
        plugin:
          type: string
        pgOutputPublicationName:
          type: string
        deliveryMode:
          type: string
        walParserMode:
          type: string
        cdcEventStoreBackfillBatchSize:
          type: integer
          format: int32
        inboxTableName:
          type: string
        inboxTtlDuration:
          type: integer
          format: int64
        slotName:
          type: string
        slotMode:
          type: string
        slotGroup:
          type: string
        walTailerPollInterval:
          type: string
        walTailerPollBackoffInterval:
          type: string
        walTailerMaxPollBackoffInterval:
          type: string
        walTailerReplicationStatusInterval:
          type: string
        dispatcherBatchSize:
          type: integer
          format: int32
        dispatcherPollInterval:
          type: string
        dispatcherPoisonPolicy:
          type: string
        dispatcherDispatchedRowPolicy:
          type: string
    ApiCdcDispatcherStatus:
      required:
      - conversionFailures
      - gapExtractionFailures
      - lastBatchSize
      - lastTickEpochMs
      - poisonRows
      - publishedEvents
      - started
      - stopping
      - tickFailures
      - ticks
      type: object
      properties:
        slotName:
          type: string
        started:
          type: boolean
        stopping:
          type: boolean
        ticks:
          type: integer
          format: int64
        tickFailures:
          type: integer
          format: int64
        conversionFailures:
          type: integer
          format: int64
        poisonRows:
          type: integer
          format: int64
        gapExtractionFailures:
          type: integer
          format: int64
        publishedEvents:
          type: integer
          format: int64
        lastBatchSize:
          type: integer
          format: int64
        lastTickEpochMs:
          type: integer
          format: int64
    ApiCdcSlotStatus:
      required:
      - active
      - exists
      - expectedPluginMatches
      - temporary
      type: object
      properties:
        slotName:
          type: string
        exists:
          type: boolean
        configuredMode:
          type: string
        expectedPlugin:
          type: string
        expectedPluginMatches:
          type: boolean
        active:
          type: boolean
        activePid:
          type: integer
          format: int32
        slotType:
          type: string
        plugin:
          type: string
        database:
          type: string
        temporary:
          type: boolean
        restartLsn:
          type: string
        confirmedFlushLsn:
          type: string
        walStatus:
          type: string
        safeWalSize:
          type: integer
          format: int64
        inactiveSince:
          type: string
        conflicting:
          type: string
        invalidationReason:
          type: string
        failover:
          type: boolean
        synced:
          type: boolean
    ApiCdcStatus:
      required:
      - availability
      - configuration
      - slot
      type: object
      properties:
        availability:
          $ref: "#/components/schemas/ApiCdcAvailability"
        configuration:
          $ref: "#/components/schemas/ApiCdcConfiguration"
        slot:
          $ref: "#/components/schemas/ApiCdcSlotStatus"
        tailer:
          type: object
          description: Null when no WAL replication tailer is running in this instance.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ApiCdcTailerStatus"
        dispatcher:
          type: object
          description: Null when no CDC dispatcher is running in this instance.
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ApiCdcDispatcherStatus"
    ApiCdcTailerStatus:
      required:
      - handlerFailures
      - inboxDuplicateWrites
      - inboxWriteFailures
      - inboxWrites
      - lastMessageEpochMs
      - messagesReceived
      - slotLockAcquired
      - started
      type: object
      properties:
        slotName:
          type: string
        slotLockAcquired:
          type: boolean
        started:
          type: boolean
        lastReceiveLsn:
          type: string
        lastAckedLsn:
          type: string
        lastMessageEpochMs:
          type: integer
          format: int64
        messagesReceived:
          type: integer
          format: int64
        inboxWrites:
          type: integer
          format: int64
        inboxDuplicateWrites:
          type: integer
          format: int64
        inboxWriteFailures:
          type: integer
          format: int64
        handlerFailures:
          type: integer
          format: int64
    ApiDBFencedLock:
      required:
      - lockName
      type: object
      properties:
        lockName:
          type: string
        currentToken:
          type: integer
          format: int64
        lockedByLockManagerInstanceId:
          type: string
        lockAcquiredTimestamp:
          type: string
          format: date-time
        lockLastConfirmedTimestamp:
          type: string
          format: date-time
    ApiExecutorJob:
      required:
      - initialDelay
      - period
      type: object
      properties:
        name:
          type: string
        initialDelay:
          type: integer
          format: int64
        period:
          type: integer
          format: int64
        unit:
          type: string
          enum:
          - NANOSECONDS
          - MICROSECONDS
          - MILLISECONDS
          - SECONDS
          - MINUTES
          - HOURS
          - DAYS
        scheduledAt:
          type: string
          format: date-time
    ApiPgCronJob:
      required:
      - active
      type: object
      properties:
        jobId:
          type: integer
          format: int32
        schedule:
          type: string
        command:
          type: string
        nodeName:
          type: string
        nodePort:
          type: integer
          format: int32
        database:
          type: string
        active:
          type: boolean
        jobName:
          type: string
    ApiPgCronJobRunDetails:
      type: object
      properties:
        jobId:
          type: integer
          format: int32
        runId:
          type: integer
          format: int32
        jobPid:
          type: integer
          format: int32
        database:
          type: string
        username:
          type: string
        command:
          type: string
        status:
          type: string
        returnMessage:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    ApiQueryStatistics:
      required:
      - calls
      - meanTime
      - totalTime
      type: object
      properties:
        query:
          type: string
        totalTime:
          type: number
          format: double
        calls:
          type: integer
          format: int64
        meanTime:
          type: number
          format: double
    ApiQueuedMessage:
      required:
      - id
      - isBeingDelivered
      - isDeadLetterMessage
      - queueName
      - redeliveryAttempts
      - totalDeliveryAttempts
      type: object
      properties:
        id:
          type: string
        queueName:
          type: string
        payload:
          type: string
          description: The raw message payload. Null unless the caller holds the QUEUE_PAYLOAD_READER
            or ESSENTIALS_ADMIN role.
          nullable: true
        addedTimestamp:
          type: string
          format: date-time
        nextDeliveryTimestamp:
          type: string
          format: date-time
        deliveryTimestamp:
          type: string
          format: date-time
        lastDeliveryError:
          type: string
        totalDeliveryAttempts:
          type: integer
          format: int32
        redeliveryAttempts:
          type: integer
          format: int32
        isDeadLetterMessage:
          type: boolean
        isBeingDelivered:
          type: boolean
    ApiQueuedStatistics:
      required:
      - avgDeliveryLatencyMs
      - queueName
      - totalMessagesDelivered
      type: object
      properties:
        queueName:
          type: string
        fromTimestamp:
          type: string
          format: date-time
        totalMessagesDelivered:
          type: integer
          format: int64
        avgDeliveryLatencyMs:
          type: integer
          format: int32
        firstDelivery:
          type: string
          format: date-time
        lastDelivery:
          type: string
          format: date-time
    ApiSubscription:
      required:
      - aggregateType
      - currentGlobalOrder
      - subscriberId
      type: object
      properties:
        subscriberId:
          type: string
        aggregateType:
          type: string
        currentGlobalOrder:
          type: integer
          format: int64
        lastUpdated:
          type: string
          format: date-time
    ApiTableActivityStatistics:
      required:
      - idx_scan
      - idx_tup_fetch
      - n_tup_del
      - n_tup_ins
      - n_tup_upd
      - seq_scan
      - seq_tup_read
      type: object
      properties:
        seq_scan:
          type: integer
          format: int64
        seq_tup_read:
          type: integer
          format: int64
        idx_scan:
          type: integer
          format: int64
        idx_tup_fetch:
          type: integer
          format: int64
        n_tup_ins:
          type: integer
          format: int64
        n_tup_upd:
          type: integer
          format: int64
        n_tup_del:
          type: integer
          format: int64
    ApiTableCacheHitRatio:
      required:
      - cacheHitRatio
      type: object
      properties:
        cacheHitRatio:
          type: integer
          format: int64
    ApiTableSizeStatistics:
      type: object
      properties:
        totalSize:
          type: string
        tableSize:
          type: string
        indexSize:
          type: string
    CountResult:
      required:
      - total
      type: object
      properties:
        total:
          type: integer
          format: int64
      description: A total count.
    DeleteResult:
      required:
      - deleted
      type: object
      properties:
        deleted:
          type: boolean
      description: Outcome of a message deletion.
    Error:
      required:
      - error
      - status
      type: object
      properties:
        status:
          type: integer
          description: The HTTP status code.
          format: int32
        error:
          type: string
          description: "Short, stable reason phrase for the status."
        message:
          type: string
          description: Human-readable detail. May be omitted where detail would leak
            internals.
          nullable: true
      description: Error response.
    GlobalEventOrderResult:
      required:
      - globalEventOrder
      type: object
      properties:
        globalEventOrder:
          type: integer
          format: int64
      description: A persisted global event order value.
    PurgeResult:
      required:
      - purgedCount
      type: object
      properties:
        purgedCount:
          type: integer
          format: int32
      description: Number of messages removed by a purge.
    QueueNameResult:
      required:
      - queueName
      type: object
      properties:
        queueName:
          type: string
      description: A resolved queue name.
    ReleaseResult:
      required:
      - released
      type: object
      properties:
        released:
          type: boolean
      description: Outcome of a lock release.
    ResurrectDeadLetterMessageRequest:
      required:
      - deliveryDelay
      type: object
      properties:
        deliveryDelay:
          type: string
          description: ISO-8601 delay before re-delivery; PT0S means immediate.
          format: duration
          example: PT0S
      description: Re-queue parameters for resurrecting a dead-letter message.
