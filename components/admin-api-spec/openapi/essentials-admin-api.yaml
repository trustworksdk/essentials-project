      - essentials_lock_writer
      - essentials_admin
  /scheduler/pg-cron-jobs:
    get:
      tags:
      - scheduler
      summary: List PostgreSQL pg_cron jobs (paginated).
      operationId: getPgCronJobs
      parameters:
