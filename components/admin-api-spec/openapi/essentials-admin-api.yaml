openapi: 3.0.3
info:
  title: Essentials Admin API
  description: |-
    Proposed HTTP admin/monitoring contract for the Essentials components (fenced locks, durable queues, scheduler, event store, CDC and PostgreSQL statistics).

    This contract is generated code-first from the in-process `*Api` SPI interfaces and is the single source of truth for both the generated Java client and the HTTP adapter that serves it (`spring-boot-starter-admin-api`).

    This document deliberately prescribes no authentication scheme. Authorization is role-based: each operation lists the roles that satisfy it under the `x-required-roles` vendor extension, and the `ESSENTIALS_ADMIN` role satisfies every operation. Those decisions are made by the hosting application's `EssentialsSecurityProvider` implementation, against the caller reported by its `EssentialsAuthenticatedUser` implementation. How the caller was authenticated is the host's business.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
servers:
- url: /api/essentials/admin/v1
  description: Relative to the host that mounts the Essentials admin API
tags:
- name: fenced-locks
  description: Inspect and release distributed fenced locks.
- name: scheduler
  description: "Inspect pg_cron jobs, their run history, and executor jobs."
- name: postgresql-query-statistics
  description: Inspect slow-query statistics from pg_stat_statements.
- name: durable-queues
  description: Inspect and manage durable queue and dead-letter messages.
- name: event-store
  description: Inspect event-store subscriptions and persisted event order.
- name: cdc
  description: Inspect Change Data Capture runtime state and effective configuration.
- name: event-store-statistics
  description: "Inspect event-store table size, activity, and cache-hit statistics."
- name: aggregate-lifecycle
  description: "Inspect aggregate snapshot and closing-books policies, generations,\
    \ and snapshots."
- name: aggregate-lifecycle-statistics
  description: Inspect aggregate snapshot and closing-books runtime statistics.
- name: aggregate-archive
  description: Inspect archived closing-books generations.
- name: aggregate-archive-statistics
  description: Inspect aggregate archive runtime statistics.
paths:
