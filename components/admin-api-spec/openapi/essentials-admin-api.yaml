            $ref: "#/components/schemas/ApiTimedMetricStatistics"
        counters:
          type: object
          additionalProperties:
            type: integer
            format: int64
        gauges:
          type: object
          additionalProperties:
            type: number
            format: double
    ApiAggregateSnapshot:
