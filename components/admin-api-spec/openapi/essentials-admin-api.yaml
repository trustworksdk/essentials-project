          nullable: true
        durableResumePointPresent:
          type: boolean
        runningInThisInstance:
          type: boolean
        active:
          type: boolean
          description: Whether the subscription is currently active. Null when the
            subscription is not running in this instance.
          nullable: true
        exclusive:
          type: boolean
          description: Whether only one instance at a time may run this subscription.
            Null when the subscription is not running in this instance.
          nullable: true
        inTransaction:
          type: boolean
          description: Whether events are handled in the transaction that persisted
            them. Null when the subscription is not running in this instance.
          nullable: true
        tenant:
          type: string
          description: The tenant the subscription is restricted to. Null when the
            subscription is not restricted to a tenant or is not running in this instance.
