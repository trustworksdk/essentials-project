                $ref: "#/components/schemas/Error"
      x-required-roles:
      - essentials_subscription_reader
      - essentials_admin
  /aggregate-archive-statistics:
    get:
      tags:
      - aggregate-archive-statistics
      summary: Return aggregate archive statistics per aggregate type.
      operationId: findAggregateArchiveStatistics
      responses:
        "200":
          description: 200 — The matching items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiAggregateArchiveStatistics"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller lacks one of the required roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-roles:
      - essentials_subscription_reader
      - essentials_admin
