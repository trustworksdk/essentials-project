          description: 200 — The matching items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiDBFencedLock"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller lacks one of the required roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error.
          content:
            application/json:
