      - essentials_postgresql_stats_reader
      - essentials_admin
  /postgresql/query-statistics/slowest:
    get:
      tags:
      - postgresql-query-statistics
      summary: "Return the statements recorded by pg_stat_statements for the current\
        \ database, ranked by the chosen order."
      operationId: getSlowestQueries
      parameters:
      - name: orderBy
        in: query
        description: What to rank by. TOTAL_TIME favours cheap statements that run
          constantly; MEAN_TIME and MAX_TIME surface statements that are slow per
          call.
        required: false
        schema:
          type: string
          default: TOTAL_TIME
          enum:
          - TOTAL_TIME
          - MEAN_TIME
          - MAX_TIME
          - CALLS
          - BLOCKS_READ
      - name: limit
        in: query
        description: Maximum number of statements to return. A value above the maximum
          is capped.
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
      responses:
        "200":
          description: 200 — The matching items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiQueryStatistics"
        "400":
          description: "Malformed or out-of-range parameter, or invalid request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller lacks one of the required roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-required-roles:
      - essentials_postgresql_stats_reader
      - essentials_admin
