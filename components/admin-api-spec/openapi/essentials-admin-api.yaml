        in: path
        description: Name of the lock to release.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: 200 — Whether the lock was released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseResult"
        "400":
          description: "Malformed or out-of-range parameter, or invalid request body."
