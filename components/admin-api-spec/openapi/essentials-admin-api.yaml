      tags:
      - fenced-locks
      summary: Release the fenced lock with the given name.
      operationId: releaseLock
      parameters:
      - name: lockName
        in: path
        description: Name of the lock to release.
        required: true
        schema:
          type: string
      responses:
        "200":
          description: 200 — Whether the lock was released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseResult"
        "400":
          description: "Malformed or out-of-range parameter, or invalid request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller lacks one of the required roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
