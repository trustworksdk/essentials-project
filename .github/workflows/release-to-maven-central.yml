name: Release to Maven Central
permissions:
  contents: read
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Will release version ${{ github.event.release.tag_name }} to Maven Central"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25 with Maven Central Release settings
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Setting Project version to release tag_name
        run: mvn -B versions:set -DnewVersion=${{ github.event.release.tag_name }} -DgenerateBackupPoms=false

      # Also a CI job on every push and pull request; repeated here so a release cut from a commit that skipped CI
      # still cannot publish an example module.
      - name: Every example module is excluded from the release
        run: python3 scripts/check-release-exclusions.py

      - name: Release to Maven Central
        # The example modules are not published artifacts. They are left out of the reactor here, and the release
        # profile's excludeArtifacts in the root pom.xml also leaves them out of the bundle; a new example module
        # goes in both (scripts/check-release-exclusions.py fails until it does). maven.deploy.skip does not do it -
        # central-publishing-maven-plugin never reads it
        run: >-
          mvn -B clean deploy -P release -DskipTests -DskipDependencyCheck=true
          -pl '!:essentials-trading-demo,!:essentials-performance-lab,!:essentials-spring-examples,!:postgresql-cqrs,!:postgresql-inbox-outbox,!:mongodb-inbox-outbox'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
