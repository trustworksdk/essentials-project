# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
#
# The matrix is deliberately split in two. Integration tests are ~99% of this build's wall clock, so running the full
# `verify` on every supported JDK multiplied that cost by five for very little extra signal — the integration suite
# exercises Testcontainers and JDBC, not JDK-version-specific behaviour. The Java 25 LTS baseline runs everything; the
# newer JDKs the enforcer range admits compile and run the unit tests, which is what actually catches a JDK-specific
# regression. Keep the unit matrix and the enforcer's upper bound in step: a JDK is added to both in the same change.

name: Java CI with Maven

permissions:
  contents: read

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]

jobs:
  # LLM/ is the only place the framework docs are edited; essentials-plugin/references/llm/ is a generated, committed
  # copy (scripts/sync-plugin-llm.sh). The pre-commit hook keeps the two in step on a contributor's machine, but hooks
  # are per clone and optional, so this gate is what enforces it. `git status` rather than `git diff`, so a doc added
  # to LLM/ without its copy fails too. No symlinks under the plugin: Git for Windows checks them out as text files.
  plugin-docs:
    name: plugin LLM docs in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the plugin's copy of LLM/ and fail on any difference
        run: |
          sh scripts/sync-plugin-llm.sh
          drift=$(git status --porcelain --untracked-files=all -- essentials-plugin/references/llm)
          if [ -n "$drift" ]; then
            echo "::error::essentials-plugin/references/llm/ is out of step with LLM/. Edit LLM/ only, run scripts/sync-plugin-llm.sh and commit both:"
            echo "$drift"
            exit 1
          fi

      # Stack requirements (S1-S11) and version pins live in references/stack/; everything else in the plugin cites them.
      - name: Plugin citation convention
        run: |
          python3 essentials-plugin/scripts/check-citations.py --self-test
          python3 essentials-plugin/scripts/check-citations.py

      - name: Fail on symlinks under essentials-plugin/
        run: |
          links=$(git ls-files -s -- essentials-plugin | awk '$1 == "120000" { print $4 }')
          if [ -n "$links" ]; then
            echo "::error::Symlinks are tracked under essentials-plugin/; commit a copy instead:"
            echo "$links"
            exit 1
          fi

  # Full build including Testcontainers-backed integration tests.
  verify:
    name: verify (JDK ${{ matrix.java-version }})
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '25' ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      # Pre-pull so Testcontainers does not pay the pull inside a test's startup timeout.
      # Keep these tags in sync with EssentialsTestContainers.POSTGRES_IMAGE / MONGO_IMAGE and with the
      # ExampleTestImages holder in each examples/essentials-spring-examples module.
      - name: Pre-pull database and broker images
        run: |
          docker pull postgres:18.4
          docker pull mongo:8.2
          docker pull apache/kafka-native:4.3.1

      - name: Build with Maven
        run: mvn -B verify --file pom.xml -DskipDependencyCheck=true

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-jdk${{ matrix.java-version }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 2

      - name: Test Summary · Unit
        if: always()
        uses: test-summary/action@v2
        with:
          paths: '**/target/surefire-reports/TEST-*.xml'
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test Summary · Integration
        if: always()
        uses: test-summary/action@v2
        with:
          paths: '**/target/failsafe-reports/TEST-*.xml'
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # Compile + unit tests only on the JDKs newer than the baseline. No Docker, so these finish in a couple of minutes.
  unit:
    name: unit (JDK ${{ matrix.java-version }})
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '26', '27' ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (unit tests only)
        run: mvn -B test --file pom.xml -DskipDependencyCheck=true

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-unit-jdk${{ matrix.java-version }}
          path: '**/target/surefire-reports/'
          retention-days: 2

      - name: Test Summary · Unit
        if: always()
        uses: test-summary/action@v2
        with:
          paths: '**/target/surefire-reports/TEST-*.xml'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
