# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
#
# The matrix is deliberately split in two. Integration tests are ~99% of this build's wall clock, so running the full
# `verify` on every supported JDK multiplied that cost by five for very little extra signal — the integration suite
# exercises Testcontainers and JDBC, not JDK-version-specific behaviour. The Java 21 LTS baseline and the newest
# supported JDK run everything; the interim JDKs compile and run the unit tests, which is what actually catches a
# JDK-specific regression.

name: Java CI with Maven

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Full build including Testcontainers-backed integration tests.
  verify:
    name: verify (JDK ${{ matrix.java-version }})
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25' ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      # Pre-pull so Testcontainers does not pay the pull inside a test's startup timeout.
      # Keep these tags in sync with EssentialsTestContainers.POSTGRES_IMAGE / MONGO_IMAGE.
      - name: Pre-pull database images
        run: |
          docker pull postgres:18.4
          docker pull mongo:8.2

      - name: Build with Maven
        run: mvn -B verify --file pom.xml -DskipDependencyCheck=true

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-jdk${{ matrix.java-version }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 2

      - name: Test Summary · Unit
        if: always()
        uses: test-summary/action@v2
        with:
          paths: '**/target/surefire-reports/TEST-*.xml'
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Test Summary · Integration
        if: always()
        uses: test-summary/action@v2
        with:
          paths: '**/target/failsafe-reports/TEST-*.xml'
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # Compile + unit tests only on the interim JDKs. No Docker, so these finish in a couple of minutes.
  unit:
    name: unit (JDK ${{ matrix.java-version }})
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '22', '23', '24' ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (unit tests only)
        run: mvn -B test --file pom.xml -DskipDependencyCheck=true

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-unit-jdk${{ matrix.java-version }}
          path: '**/target/surefire-reports/'
          retention-days: 2

      - name: Test Summary · Unit
        if: always()
        uses: test-summary/action@v2
        with:
          paths: '**/target/surefire-reports/TEST-*.xml'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
