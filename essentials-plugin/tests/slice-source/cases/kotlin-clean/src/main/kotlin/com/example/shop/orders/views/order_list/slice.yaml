schemaVersion: "1.3"
slice: orders.order_list
kind: view
bc: orders
owner: orders-team
status: live
summary: List orders.
generator: essentials
language: kotlin
tier: cqrs-es
lane: decider
serves: [ListOrders, OrdersBetween, ShippedOrders, SearchOrders]
endpoints:
  - { method: GET, path: "/api/orders/list", auth: user }
  - { method: GET, path: "/api/orders/list?from=&to=", auth: user }
  - { method: GET, path: "/api/orders/list?status=shipped", auth: user }
  - { method: GET, path: "/api/orders/list/search?q", auth: user }
owns: [OrderListView]
projections:
  - { name: OrderListView, aggregateTypes: [Orders], from: [OrderPlaced, OrderCancelled], consistency: eventual }
tests:
  unit: { present: false }
