schemaVersion: "1.3"
slice: orders.order_lookup
kind: view
bc: orders
owner: orders-team
status: live
summary: Look orders up.
generator: essentials
language: java
serves: [GetOrder, GetLegacyOrder, OrdersByCustomer, OrdersBySku]
endpoints:
  - { method: GET, path: "/api/orders/lookup/{orderId}", auth: user }
  - { method: GET, path: "/api/orders/lookup/legacy/{id}", auth: user }
  - { method: GET, path: "/api/orders/lookup?customerId=", auth: user }
  - { method: GET, path: "/api/orders/lookup/by-sku/{sku}", auth: user }
owns: [OrderLookupView]
tests:
  unit: { present: false }
