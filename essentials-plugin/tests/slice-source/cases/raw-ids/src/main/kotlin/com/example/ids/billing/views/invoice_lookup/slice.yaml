schemaVersion: "1.3"
slice: billing.invoice_lookup
kind: view
bc: billing
owner: billing-team
status: live
summary: Look invoices up.
generator: essentials
language: kotlin
serves: [GetInvoice, GetRawInvoice, InvoicesByCustomer, InvoicesByStatus]
endpoints:
  - { method: GET, path: "/api/billing/lookup/{invoiceId}", auth: user }
  - { method: GET, path: "/api/billing/lookup/raw/{invoiceId}", auth: user }
  - { method: GET, path: "/api/billing/lookup?customerId=", auth: user }
  - { method: GET, path: "/api/billing/lookup?status=", auth: user }
owns: [InvoiceLookupView]
tests:
  unit: { present: false }
