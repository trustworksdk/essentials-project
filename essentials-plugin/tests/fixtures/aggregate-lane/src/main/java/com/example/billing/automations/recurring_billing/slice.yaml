schemaVersion: "1.3"
slice: billing.recurring_billing
kind: automation
bc: billing
owner: billing-team
status: live
summary: Issue the next period's invoice once an invoice is paid.
generator: essentials
language: java
tier: cqrs-es
lane: aggregate
consumes: [InvoiceIssued, InvoicePaid]
dispatches: [IssueInvoice]
invariants:
  - { id: INV-RB-1, text: "At most one follow-up invoice per paid invoice", enforcedBy: RecurringBillingTodo }
forbidden:
  - cross-slice-internal:billing
tests:
  unit: { present: false }
  integration: { present: false }
  contract: { present: false }
