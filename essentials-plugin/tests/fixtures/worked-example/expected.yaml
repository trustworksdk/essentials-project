# expected.yaml — the machine-readable oracle for this fixture (format 1). TEST-GUIDE.md is the
# human description of the same expectations; when they disagree, fix both.
#
# Paths are relative to this fixture's directory. `line` is 1-based and `anchor` is text that must
# appear on that line, so a stale line number is detectable. `gate` is the /essentials:slice-check
# gate as written in commands/slice-check.md ("14", "8a", "6"); `ess` is the review id derived from
# it (ESS-G<gate><clause>); both are null where the oracle is a law section rather than a numbered
# gate. Severities: Blocking | Should-fix | Advisory.
#
#   runs          which command runs against this fixture, with which argument
#   lanes         gate 14 per bounded context: code signals, declared lanes, verdict
#   must_find     every entry must appear in the report (matched on file, plus symbol when given)
#   must_not_find a finding under any listed gate at that file/symbol fails the run ("*" = any gate)
#   skipped       gates the report must name as skipped or out of scope, never silently omit
#   tolerated     findings that may appear or not; neither counts for or against the run
#   reader        syntactic facts a source reader must extract (handlers, mappings, endpoint bindings)
#   slice_map     what /essentials:slice-map must draw: slice count, event/command edges, cycles
#   manifests     facts about the manifests themselves (service-entity)
#   terrain, contexts, slices, ladder
#                 /essentials:slice-discover's passes 0-4 (brownfield-layered); must_find there carries
#                 `rank` (payoff order) and `kind` instead of a gate, and severity is null by design
#
# `tests/fixtures/check-expected.py` checks this file against the tree (paths, line anchors, ess ids)
# and that no fixture source carries an oracle hint.
#
# Entry fields beyond file/line/anchor: `symbol` narrows the match to a type or method; `also_names`
# lists other files the same finding must cite; `may_merge_with` names a finding this one may be
# reported inside of; `law` names the rules/slice-design.md section when `gate` is null.

