schemaVersion: "1.4"
slice: orders.place_order
kind: command
bc: orders
owner: orders-team
status: live
summary: Place an order for a customer.
generator: essentials
language: java
tier: cqrs-es
lane: decider
flow: checkout
handles: [PlaceOrder]
publishes: [OrderPlaced]
writes:
  - { name: Order }
endpoints:
  - { method: POST, path: "/api/orders", auth: user }
invariants:
  - { id: positive-quantity, text: "An order has a positive quantity.", enforcedBy: "PlaceOrderDecider" }
scenarios:
  - name: places an order
    when:
      command: PlaceOrder
      with: { orderId: o-1, customerId: c-7, quantity: 2 }
    then:
      - event: OrderPlaced
        with: { orderId: o-1, customerId: c-7, quantity: 2 }
    test: PlaceOrderTest#placesAnOrder
  - name: rejects a zero quantity
    when: { command: PlaceOrder, with: { orderId: o-2, quantity: 0 } }
    then: { error: IllegalArgumentException, message: "quantity must be positive" }
    test: PlaceOrderTest#rejects a zero quantity
forbidden:
  - cross-slice-internal:orders
tests:
  unit: { present: true }
  integration: { present: false }
