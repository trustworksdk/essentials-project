schemaVersion: "1.4"
slice: orders.cancel_order
kind: command
bc: orders
owner: orders-team
status: live
summary: Cancel a placed order.
generator: essentials
language: java
tier: cqrs-es
lane: decider
handles: [CancelOrder]
publishes: [OrderCancelled]
writes:
  - { name: Order }
endpoints:
  - { method: POST, path: "/api/orders/{id}/cancel", auth: user }
scenarios:
  - name: cancels a placed order
    given:
      - event: OrderPlaced
        with: { orderId: o-1, customerId: c-7, quantity: 2 }
    when: { command: CancelOrder, with: { orderId: o-1, reason: changed mind } }
    then:
      - event: OrderCancelled
        with: { orderId: o-1, reason: changed mind }
    test: CancelOrderTest#cancelsAPlacedOrder
  - name: cancelling twice is a no-op
    given: [{ event: OrderPlaced }, { event: OrderCancelled }]
    when: { command: CancelOrder, with: { orderId: o-1 } }
    then: { nothing: true }
    test: CancelOrderTest#cancellingTwiceIsANoOp
  - name: rejects an unknown order
    when: { command: CancelOrder, with: { orderId: o-404, priority: high } }
    then: { error: OrderNotFound, message: "Order o-404 not found" }
forbidden:
  - cross-slice-internal:orders
tests:
  unit: { present: true }
  integration: { present: false }
