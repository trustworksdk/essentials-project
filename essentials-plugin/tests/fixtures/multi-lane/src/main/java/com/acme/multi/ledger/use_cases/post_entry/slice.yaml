schemaVersion: "1.3"
slice: ledger.post_entry
kind: command
bc: ledger
owner: ledger-team
status: live
summary: Post a money-moving entry to an open account.
generator: essentials
language: java
tier: aggregate
lane: aggregate
handles: [PostEntry]
