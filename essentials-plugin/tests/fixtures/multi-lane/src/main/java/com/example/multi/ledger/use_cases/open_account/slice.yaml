schemaVersion: "1.3"
slice: ledger.open_account
kind: command
bc: ledger
owner: ledger-team
status: live
summary: Open a ledger account in a currency.
generator: essentials
language: java
tier: cqrs-es
lane: decider
handles: [OpenAccount]
publishes: [AccountOpened]
endpoints:
  - { method: POST, path: "/api/ledger/accounts", auth: user }
writes: [Account]
invariants:
  - { id: INV-OA-1, text: "Currency is an ISO 4217 code", enforcedBy: OpenAccountDecider }
forbidden:
  - cross-slice-internal:ledger
tests:
  unit: { present: false }
  integration: { present: false }
  contract: { present: false }
