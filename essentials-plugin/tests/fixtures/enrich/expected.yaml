must_not_find:
- id: E-T1
  file: src/main/java/com/example/library/lending/use_cases/borrow_book/BorrowBook.java
  line: 15
  anchor: 'requireNonNull(memberId, "memberId is required");'
  what: a drafted invariant such as "memberId is required"
  why: >-
    A requireNonNull is a null guard on an argument, not a business rule. Invariants are drafted from
    guard messages that state a rule, which is why propose reports none here.
- id: E-T2
  file: src/main/java/com/example/library/lending/use_cases/borrow_book/BorrowBookDecider.java
  line: 15
  anchor: 'throw new IllegalArgumentException("copyId is required");'
  what: a drafted invariant such as "copyId is required"
  why: An `if (x == null) throw` is a null check written out by hand; it states no rule.
- id: E-T3
  file: src/main/java/com/example/library/lending/use_cases/borrow_book/BorrowBookDecider.java
  line: 23
  anchor: '// throw new IllegalStateException("A reserved copy cannot be lent");'
  what: a drafted invariant such as "A reserved copy cannot be lent"
