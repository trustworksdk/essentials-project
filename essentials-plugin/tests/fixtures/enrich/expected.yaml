# expected.yaml — the machine-readable expectations for this fixture (format 1). TEST-GUIDE.md is the
# human description of the same expectations; when they disagree, fix both.
#
# Paths are relative to this fixture's directory. `line` is 1-based and `anchor` is text that must
# appear on that line, so a stale line number is detectable. Severities are null throughout:
# /essentials:slice-enrich drafts and asks, it does not grade.
#
#   runs          the command run against this fixture, with its arguments, and what the run must do
#   must_find     every entry must appear in the command's final report (journeys, drafts, skips, refusals)
#   must_not_find a draft, attribution or write the report must not contain
#
# The deterministic half (the proposal JSON, apply's diff) is byte-diffed by
# tests/scripts/test_slice_enrich.py against tests/slice-enrich/golden/. These entries cover what the
# model does with that output: commands/slice-enrich.md Steps 4-7. The eval runs non-interactively and
# under --dry-run, with the prompt answering Yes to every journey and every slice
# (evals/slice-enrich-library/case.yaml); expectations below assume those answers.
#
# `tests/fixtures/check-expected.py` checks this file against the tree (paths, line anchors) and that no
# fixture source carries an answer hint.

fixture: enrich
language: java (one Kotlin context, accounts)
runs:
- command: /essentials:slice-enrich
  args: ". --dry-run"
  expect: >-
    It ran slice-source.py and `slice-enrich.py propose` before drafting anything, then
    `slice-enrich.py apply` with --dry-run on an accepted set built from the all-Yes answers. The report
    quotes apply's per-manifest lines (`would write …` and the one `refused …` line) as the script printed
    them, says plainly that nothing was written, and never claims a manifest was changed.

