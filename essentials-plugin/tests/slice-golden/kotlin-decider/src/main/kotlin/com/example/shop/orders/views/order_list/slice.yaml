# Per-slice manifest. Schema: essentials references/slice/slice-yaml.schema.json
# Field guide: references/slice/manifest-guide.md · Law: rules/slice-design.md
schemaVersion: "1.3"
slice: orders.order_list
kind: view
bc: orders
owner: orders-team
status: live
summary: TODO one sentence, present tense.
generator: essentials
language: kotlin
tier: cqrs-es                        # architectureTier vocabulary (cqrs-es | service-entity | …)
lane: decider                        # the §R5 write style: decider | aggregate | service-entity

# --- Contracts ---
# `serves` takes QUERY NAMES, not routes. The route belongs in `endpoints`.
serves: [OrderList]
endpoints:
  - { method: GET, path: "/api/orders", auth: user }

# --- Data ---
reads:
  - { name: OrderListView }
projections:
  - name: OrderListProjection
    aggregateTypes: [Orders]   # the STREAM(s) subscribed to — not events
    from: [OrderPlaced]                 # TODO every event this view projects
    consistency: eventual             # ViewEventProcessor; use `strong` for InTransactionEventProcessor
    store: document-db

# --- Boundaries (rules/slice-design.md §R4) ---
forbidden:
  - cross-slice-internal:orders

# --- Testing ---
tests:
  unit: { present: false }
  integration: { present: true }
  contract: { present: false }
