# Per-slice manifest. Schema: essentials references/slice/slice-yaml.schema.json
# Field guide: references/slice/manifest-guide.md · Law: rules/slice-design.md
schemaVersion: "1.3"
slice: {{bc}}.{{externalSystem}}
kind: translation
bc: {{bc}}
owner: {{owner}}
status: live
summary: Anti-corruption boundary to the {{ExternalSystem}} system.
generator: essentials
language: java
tier: {{tier}}                        # architectureTier vocabulary (cqrs-es | service-entity | …)
lane: {{lane}}                        # the §R5 write style: decider | aggregate | service-entity

# --- Contracts ---
# A translation slice has NO external API of its own — the webhook ingress is the external
# system's, not the bounded context's.
externalSystem: {{externalSystem}}
direction: both                       # inbound | outbound | both — delete the half you do not use
# `direction: outbound` is a port-style ACL: the system calls out and nothing calls in, so
# there is no inbound message and no mapping table. Set it and DELETE `consumes` and `maps`
# rather than leaving them empty — the schema stops requiring them, and `consumes: []`
# records nothing. It is still a translation slice.
consumes: [{{ExternalEvent}}]
maps:
  - { from: {{ExternalEvent}}, to: TODOInternalCommand }
  - { from: {{Event}}, to: {{ExternalSystem}}Request }

# --- Boundaries (rules/slice-design.md §R4) ---
forbidden:
  - cross-slice-internal:{{bc}}

# --- Testing ---
# Contract testing is the floor for a translation slice. This plugin bundles no contract-testing
# tooling — the shipped test is a plain round-trip; add Pact/Specmatic yourself and flip this.
tests:
  unit: { present: true }
  integration: { present: false }
  contract: { present: false }
