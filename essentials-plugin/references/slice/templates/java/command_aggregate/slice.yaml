# Per-slice manifest. Schema: essentials references/slice/slice-yaml.schema.json
# Field guide: references/slice/manifest-guide.md · Law: rules/slice-design.md
schemaVersion: "1.3"
slice: {{bc}}.{{slice}}
kind: command
bc: {{bc}}
owner: {{owner}}
status: live
summary: TODO one sentence, present tense.
generator: essentials
language: java
tier: {{tier}}                        # architectureTier vocabulary (cqrs-es | service-entity | …)
lane: {{lane}}                        # the §R5 write style: decider | aggregate | service-entity

# --- Contracts ---
handles: [{{Command}}]
publishes: [{{Event}}]        # appended to the aggregate's event stream
endpoints:
  # ALWAYS quote the endpoint path. An unquoted scalar containing a brace opens a YAML flow
  # mapping and the file stops being valid YAML — silently, since nothing in a JVM build parses it.
  - { method: POST, path: "{{apiPath}}/{id}", auth: user }

# --- Data ---
writes: [{{Aggregate}}]       # the aggregate this slice mutates — gate 4 checks one command slice per writer
reads:
  - { name: {{Aggregate}} }   # rehydrated from its own stream by {{Aggregates}}

# --- Rules ---
invariants:
  # On this lane the enforcer is the AGGREGATE METHOD, never the handler. A handler named here is a
  # sign the decision has leaked out of the consistency boundary.
  - { id: INV-1, text: "TODO the rule this slice enforces", enforcedBy: "{{Aggregate}}.applyPlaceholder" }

# --- Boundaries (machine-checkable prohibitions — rules/slice-design.md §R4) ---
forbidden:
  - cross-slice-internal:{{bc}}     # import only another slice's events/ + types/

# --- Testing ---
tests:
  unit: { present: true }           # the aggregate invariant, pure — no Spring, no database
  integration: { present: true }    # through the CommandBus, asserting the appended event
  contract: { present: false }
