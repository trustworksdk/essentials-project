# Per-slice manifest. Schema: essentials references/slice/slice-yaml.schema.json
# Field guide: references/slice/manifest-guide.md · Law: rules/slice-design.md
schemaVersion: "1.3"
slice: {{bc}}.{{view}}
kind: view
bc: {{bc}}
owner: {{owner}}
status: live
summary: TODO one sentence, present tense.
generator: essentials
language: java
tier: {{tier}}                        # architectureTier vocabulary (cqrs-es | service-entity | …)
lane: {{lane}}                        # the §R5 write style: decider | aggregate | service-entity

# --- Contracts ---
# `serves` takes QUERY NAMES, not routes. The route belongs in `endpoints`.
serves: [{{View}}]
endpoints:
  - { method: GET, path: "{{apiPath}}", auth: user }

# --- Data ---
reads:
  - { name: {{View}}View }
projections:
  - name: {{View}}Projection
    aggregateTypes: [{{AggregateType}}]   # the STREAM(s) subscribed to — not events
    from: [{{Event}}]                 # TODO every event this view projects
    consistency: eventual             # ViewEventProcessor; use `strong` for InTransactionEventProcessor
    store: document-db

# --- Boundaries (rules/slice-design.md §R4) ---
forbidden:
  - cross-slice-internal:{{bc}}

# --- Testing ---
tests:
  unit: { present: false }
  integration: { present: true }
  contract: { present: false }
