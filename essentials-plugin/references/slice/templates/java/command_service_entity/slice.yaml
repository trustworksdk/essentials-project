# Per-slice manifest. Schema: essentials references/slice/slice-yaml.schema.json
# Field guide: references/slice/manifest-guide.md · Law: rules/slice-design.md
schemaVersion: "1.3"
slice: {{bc}}.{{slice}}
kind: command
bc: {{bc}}
owner: {{owner}}
status: live
summary: TODO one sentence, present tense.
generator: essentials
language: java
tier: {{tier}}                        # architectureTier vocabulary (cqrs-es | service-entity | …)
lane: {{lane}}                        # the §R5 write style: decider | aggregate | service-entity

# --- Contracts ---
handles: [{{Command}}]
publishes: [{{Event}}]        # published on the EventBus, not appended to a stream
endpoints:
  - { method: POST, path: "{{apiPath}}", auth: user }

# --- Data ---
writes: [{{Entity}}]          # the entity this slice mutates — gate 4 checks one command slice per writer
reads:
  - { name: {{Entity}} }

# --- Rules ---
invariants:
  - { id: INV-1, text: "TODO the rule this slice enforces", enforcedBy: "{{Entity}}.applyPlaceholder" }

# --- Boundaries (machine-checkable prohibitions — rules/slice-design.md §R4) ---
forbidden:
  - cross-slice-internal:{{bc}}     # import only another slice's events/ + types/

# --- Testing ---
tests:
  unit: { present: true }           # the entity invariant, pure
  integration: { present: true }    # through the CommandBus, asserting the event
  contract: { present: false }
