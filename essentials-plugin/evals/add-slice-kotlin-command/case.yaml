schema_version: "1.1"
name: add-slice-kotlin-command
description: "add-slice smoke test — the first command slice of a new decider-lane BC in a freshly rendered Kotlin host"
tags: [add-slice]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    /essentials:add-slice This session is non-interactive, so these are my answers to every question you would ask. Do not ask; use them.
    - Kind: Command
    - Bounded context: a new one, `orders`, whose aggregate is `Order` (AggregateType `Orders`)
    - Write-style lane: Decider
    - Slice `place_order`, command `PlaceOrder`, event `OrderPlaced`, owner `orders-team`
    - The command carries `sku` (String) and `quantity` (Int); the event records the same two facts.
    - Invariant: the quantity must be at least 1 — a PlaceOrder with a quantity below 1 is rejected.
    - Summary: Place an order for a quantity of one SKU.
    - Rules pointer: if it is missing or stale, write it.
    Fill in every TODO these answers settle, and wire the slice up.
