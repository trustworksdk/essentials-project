openapi: 3.1.0
info:
  title: Exchange simulator API
  version: 0.1.0
  summary: A stock exchange simulator with price-time matching, settlement and clearing simulation, and signed webhooks.
  description: |
    Commands are answered after they are committed to SQLite. Field names are camelCase, enums use their upper-case
    wire names, and prices are integer `priceTicks` plus, in responses, a decimal `price` string in major currency
    units. Every error is `{"error": "<code>", "message": "<text>"}`.

    In the `fast` and `memory` persistence modes every response carries an `Exchange-Persistence: <mode>` header;
    durable responses carry none.

    The `test-control` operations are mounted only with `test_control.enabled: true` (they return `404` otherwise)
    and must never be exposed outside test deployments.

    The README is the full reference; this specification is checked against the service by its test suite
    (`tests/openapi.rs`).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
tags:
  - name: service
    description: Health, metrics and this specification.
  - name: instruments
  - name: participants
  - name: orders
  - name: trades
  - name: events
    description: The canonical event log, replayable by sequence.
  - name: settlements
    description: The settlement simulator's instructions and externally reported outcomes.
  - name: clearing
    description: End-of-day clearing statements.
  - name: webhooks
    description: Webhook subscriptions and their maintenance. Shared with the payment gateway.
  - name: test-control
    description: Only with `test_control.enabled`. Simulated time, reset, delivery inspection, fault injection, breaks.

paths:
  /health:
    get:
      tags: [service]
      operationId: health
      summary: Liveness and readiness
      responses:
        "200":
          description: The process is up and the database answers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database does not answer.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { const: unavailable }
  /metrics:
    get:
      tags: [service]
      operationId: metrics
      summary: Prometheus metrics
      responses:
        "200":
          description: The Prometheus text format.
          content:
            text/plain:
              schema: { type: string }
  /openapi.yaml:
    get:
      tags: [service]
      operationId: openapi
      summary: This specification
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }

  /api/instruments:
    post:
      tags: [instruments]
      operationId: registerInstrument
      summary: Register an instrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstrumentRequest" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [instruments]
      operationId: listInstruments
      summary: List instruments, optionally by symbol and identifiers
      parameters:
        - { name: symbol, in: query, schema: { type: string } }
        - { name: mic, in: query, schema: { type: string } }
        - { name: isin, in: query, schema: { type: string } }
        - { name: cusip, in: query, schema: { type: string } }
      responses:
        "200":
          description: Matching instruments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/instruments/{id}:
    patch:
      tags: [instruments]
      operationId: updateInstrument
      summary: Enable or disable trading
      description: Resting orders stay; cancellations keep working while an instrument is disabled.
      parameters:
        - { $ref: "#/components/parameters/InstrumentIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The instrument after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/participants:
    post:
      tags: [participants]
      operationId: registerParticipant
      summary: Register a participant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Participant" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/orders:
    post:
      tags: [orders]
      operationId: submitOrder
      summary: Submit an order
      description: |
        `201` with the committed outcome, exchange rejections included (status `REJECTED` with a `rejectReason`).
        `200` with the existing order and `duplicate: true` when the `clientOrderId` was already used with the same
        terms.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
      responses:
        "201":
          description: Committed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResult" }
        "200":
          description: A repeated client order ID; the existing order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [orders]
      operationId: getOrder
      summary: An order, with its stored timestamps
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel an open or partially filled order
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/orderbooks/{instrumentId}:
    get:
      tags: [orders]
      operationId: orderBook
      summary: An instrument's book, aggregated by price level
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/trades:
    get:
      tags: [trades]
      operationId: listTrades
      summary: Executions in insertion order
      parameters:
        - { name: instrumentId, in: query, schema: { type: string } }
        - { name: participantId, in: query, description: Buyer or seller., schema: { type: string } }
        - { name: orderId, in: query, description: Buy or sell order., schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Matching executions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trade" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Canonical events after a sequence, in sequence order
      parameters:
        - { name: after, in: query, description: Events with a sequence greater than this; default 0., schema: { type: integer, minimum: 0 } }
        - { $ref: "#/components/parameters/Limit" }
        - { name: eventType, in: query, schema: { $ref: "#/components/schemas/EventType" } }
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/settlements:
    get:
      tags: [settlements]
      operationId: listSettlements
      summary: Simulated settlement instructions in trade order
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SettlementStatus" } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Instructions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Settlement" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/settlements/{executionId}:
    get:
      tags: [settlements]
      operationId: getSettlement
      summary: Everything known about one execution's settlement
      description: The simulated instruction and its events, and externally reported outcomes, side by side, never merged.
      parameters:
        - { $ref: "#/components/parameters/ExecutionIdPath" }
      responses:
        "200":
          description: The settlement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/settlements/{executionId}/outcomes:
    post:
      tags: [settlements]
      operationId: reportSettlementOutcome
      summary: Report an outcome from an external settlement service
      description: |
        `201` with the stored report and `duplicate: false`; `200` with the original and `duplicate: true` when
        `reference` repeats an identical report. Refused with `409 external_outcomes_disabled` in settlement mode
        `simulated`, and `409 report_conflict` when `reference` was used with a different outcome.
      parameters:
        - { $ref: "#/components/parameters/ExecutionIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "200":
          description: A repeated report; the original.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/clearing/statements:
    get:
      tags: [clearing]
      operationId: listClearingStatements
      summary: Issued clearing statements, in date and participant order
      parameters:
        - { $ref: "#/components/parameters/BusinessDate" }
        - { name: participant, in: query, schema: { type: string } }
      responses:
        "200":
          description: Statements.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClearingStatement" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/clearing/statements/{id}:
    get:
      tags: [clearing]
      operationId: getClearingStatement
      summary: One issued clearing statement
      description: "`404` also for a late statement not issued yet."
      parameters:
        - { name: id, in: path, required: true, description: "`CS:<businessDate>:<participant>`", schema: { type: string } }
      responses:
        "200":
          description: The statement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClearingStatement" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/webhooks:
    post:
      tags: [webhooks]
      operationId: registerWebhook
      summary: Register a webhook subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookRequest" }
      responses:
        "201":
          description: Registered. It receives events committed from now on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: List subscriptions
      parameters:
        - { name: includeDeleted, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Subscriptions in creation order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/webhooks/{id}:
    parameters:
      - { $ref: "#/components/parameters/SubscriptionIdPath" }
    get:
      tags: [webhooks]
      operationId: getWebhook
      summary: A subscription and how its deliveries stand
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [webhooks]
      operationId: updateWebhook
      summary: Change, pause or disable a subscription
      description: A subscription declared in configuration only takes `paused` (`409 managed_by_configuration` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookUpdate" }
      responses:
        "200":
          description: The subscription after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete a subscription created through the API
      description: Its deliveries and attempts are kept; it gets no new deliveries and sends none.
      responses:
        "204":
          description: Deleted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/webhooks/{id}/secret:
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret
      description: For `graceSeconds` deliveries are signed with both the new and the previous secret.
      parameters:
        - { $ref: "#/components/parameters/SubscriptionIdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretRotation" }
      responses:
        "200":
          description: The subscription after the rotation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/webhooks/{id}/deliveries:
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: A subscription's deliveries in event order
      parameters:
        - { $ref: "#/components/parameters/SubscriptionIdPath" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DeliveryStatus" } }
        - { name: after, in: query, description: Deliveries of events after this sequence., schema: { type: integer, minimum: 0 } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Deliveries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/webhooks/{id}/redeliver:
    post:
      tags: [webhooks]
      operationId: redeliverWebhook
      summary: Queue the subscription's events after a sequence for delivery again
      parameters:
        - { $ref: "#/components/parameters/SubscriptionIdPath" }
        - { $ref: "#/components/parameters/RedeliverAfter" }
      responses:
        "200":
          description: How many were queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/webhooks/{id}/dead-letters/retry:
    post:
      tags: [webhooks]
      operationId: retryWebhookDeadLetters
      summary: Retry the subscription's dead letters with a fresh attempt budget
      parameters:
        - { $ref: "#/components/parameters/SubscriptionIdPath" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                deliveryIds:
                  description: Only these; all when empty or absent.
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: How many were retried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retried" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /test/scenarios:
    post:
      tags: [test-control]
      operationId: runScenario
      summary: Run a scenario in a sandbox
      description: The service's own state is untouched. `200` whether the scenario passed or not (see `passed`).
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /test/reset:
    post:
      tags: [test-control]
      operationId: reset
      summary: Clear all state, as on a new database
      responses:
        "204":
          description: Reset. The virtual clock is back at its first reading; only the configuration remains.
        "503": { $ref: "#/components/responses/Unavailable" }
  /test/clearing/breaks:
    get:
      tags: [test-control]
      operationId: listClearingBreaks
      summary: Clearing statements with reconciliation breaks, issued or still waiting
      parameters:
        - { $ref: "#/components/parameters/BusinessDate" }
        - { name: participant, in: query, schema: { type: string } }
      responses:
        "200":
          description: Statements with their breaks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClearingBreaks" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /test/clock:
    get:
      tags: [test-control]
      operationId: getClock
      summary: How the service tells time
      responses:
        "200": { $ref: "#/components/responses/Clock" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /test/clock/advance:
    post:
      tags: [test-control]
      operationId: advanceClock
      summary: Move the virtual clock forward
      description: Whatever becomes due by the new time happens before the call returns.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClockAdvance" }
      responses:
        "200": { $ref: "#/components/responses/Clock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /test/clock/set:
    post:
      tags: [test-control]
      operationId: setClock
      summary: Move the virtual clock to an instant
      description: Earlier than now is `409 clock_backwards`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: { type: string, format: date-time }
      responses:
        "200": { $ref: "#/components/responses/Clock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /test/clock/freeze:
    post:
      tags: [test-control]
      operationId: freezeClock
      summary: Stop the virtual clock
      responses:
        "200": { $ref: "#/components/responses/Clock" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /test/clock/resume:
    post:
      tags: [test-control]
      operationId: resumeClock
      summary: Let the virtual clock run at its speed
      responses:
        "200": { $ref: "#/components/responses/Clock" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /test/clock/speed:
    post:
      tags: [test-control]
      operationId: setClockSpeed
      summary: Change how fast the virtual clock runs
      description: From the current reading on. Out of range is `400 invalid_clock_speed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [speed]
              properties:
                speed: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
      responses:
        "200": { $ref: "#/components/responses/Clock" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /test/deliveries:
    get:
      tags: [test-control]
      operationId: listAllDeliveries
      summary: Webhook deliveries across all subscriptions, in event order
      parameters:
        - { name: subscriptionId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DeliveryStatus" } }
      responses:
        "200":
          description: Deliveries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /test/dead-letters/retry:
    post:
      tags: [test-control]
      operationId: retryAllDeadLetters
      summary: Retry dead letters (all, one subscription's, or the listed ones)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                subscriptionId: { type: string, format: uuid }
                deliveryIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: How many were retried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retried" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /test/webhooks/{id}/redeliver:
    post:
      tags: [test-control]
      operationId: testRedeliverWebhook
      summary: Queue a subscription's events for delivery again (same as the /api route)
      parameters:
        - { $ref: "#/components/parameters/SubscriptionIdPath" }
        - { $ref: "#/components/parameters/RedeliverAfter" }
      responses:
        "200":
          description: How many were queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /test/attempts:
    get:
      tags: [test-control]
      operationId: listAttempts
      summary: Every webhook request sent and every hold, oldest first
      parameters:
        - { name: subscriptionId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Attempts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Attempt" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /test/webhooks/{id}/faults:
    parameters:
      - { $ref: "#/components/parameters/SubscriptionIdPath" }
    put:
      tags: [test-control]
      operationId: setWebhookFaults
      summary: Set a subscription's delivery fault policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaultPolicy" }
      responses:
        "200":
          description: The subscription with its policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      tags: [test-control]
      operationId: clearWebhookFaults
      summary: Remove a subscription's fault policy
      responses:
        "200":
          description: The subscription without a policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

webhooks:
  OrderAccepted:
    post:
      summary: An order was accepted (`OPEN`, nothing filled)
      operationId: onOrderAccepted
      requestBody: { $ref: "#/components/requestBodies/OrderAcceptedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  OrderRejected:
    post:
      summary: An order was rejected, with `rejectReason`
      operationId: onOrderRejected
      requestBody: { $ref: "#/components/requestBodies/OrderRejectedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  OrderPartiallyFilled:
    post:
      summary: An order traded part of its quantity
      operationId: onOrderPartiallyFilled
      requestBody: { $ref: "#/components/requestBodies/OrderPartiallyFilledEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  OrderFilled:
    post:
      summary: An order traded its whole quantity
      operationId: onOrderFilled
      requestBody: { $ref: "#/components/requestBodies/OrderFilledEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  OrderCancelled:
    post:
      summary: An order was cancelled, with `cancelReason`
      operationId: onOrderCancelled
      requestBody: { $ref: "#/components/requestBodies/OrderCancelledEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  TradeExecuted:
    post:
      summary: A trade, with everything a settlement consumer needs
      operationId: onTradeExecuted
      requestBody: { $ref: "#/components/requestBodies/TradeExecutedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  SettlementPending:
    post:
      summary: A settlement instruction was created
      operationId: onSettlementPending
      requestBody: { $ref: "#/components/requestBodies/SettlementPendingEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  SettlementCompleted:
    post:
      summary: A trade settled
      operationId: onSettlementCompleted
      requestBody: { $ref: "#/components/requestBodies/SettlementCompletedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  SettlementFailed:
    post:
      summary: A settlement failed
      operationId: onSettlementFailed
      requestBody: { $ref: "#/components/requestBodies/SettlementFailedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  SettlementRejected:
    post:
      summary: A settlement instruction was rejected at intake
      operationId: onSettlementRejected
      requestBody: { $ref: "#/components/requestBodies/SettlementRejectedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  SettlementDelayed:
    post:
      summary: A settlement moved to a later date
      operationId: onSettlementDelayed
      requestBody: { $ref: "#/components/requestBodies/SettlementDelayedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  SettlementCorrected:
    post:
      summary: A settled amount was corrected
      operationId: onSettlementCorrected
      requestBody: { $ref: "#/components/requestBodies/SettlementCorrectedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  SettlementCancelled:
    post:
      summary: A settlement was cancelled
      operationId: onSettlementCancelled
      requestBody: { $ref: "#/components/requestBodies/SettlementCancelledEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  SettlementOutcomeReported:
    post:
      summary: An external settlement service reported an outcome (`source` is `external`)
      operationId: onSettlementOutcomeReported
      requestBody: { $ref: "#/components/requestBodies/SettlementOutcomeReportedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  ClearingStatementIssued:
    post:
      summary: An end-of-day clearing statement for one participant (`source` is `clearinghouse`)
      operationId: onClearingStatementIssued
      requestBody: { $ref: "#/components/requestBodies/ClearingStatementIssuedEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }

components:
  parameters:
    Limit:
      name: limit
      in: query
      description: 1 to 1000; default 100.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    BusinessDate:
      name: date
      in: query
      description: Business date.
      schema: { type: string, format: date }
    InstrumentIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    ExecutionIdPath:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionIdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RedeliverAfter:
      name: after
      in: query
      description: Redeliver events with a sequence after this one (default 0, all), also those from before the subscription existed.
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    BadRequest:
      description: "`invalid_json`, `invalid_request` or another validation code; the message says what is wrong."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: A conflict with the current state; `error` names it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: "`unknown_instrument` or `unknown_participant`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: "`overloaded` (the command queue is full; retry later) or `unavailable`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Clock:
      description: The clock after the call.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Clock" }
    WebhookAck:
      description: Delivered. Any other answer is retried with backoff until the delivery is dead-lettered.

  requestBodies:
    OrderAcceptedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/OrderAcceptedEvent" } } }
    OrderRejectedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/OrderRejectedEvent" } } }
    OrderPartiallyFilledEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/OrderPartiallyFilledEvent" } } }
    OrderFilledEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/OrderFilledEvent" } } }
    OrderCancelledEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/OrderCancelledEvent" } } }
    TradeExecutedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/TradeExecutedEvent" } } }
    SettlementPendingEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/SettlementPendingEvent" } } }
    SettlementCompletedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/SettlementCompletedEvent" } } }
    SettlementFailedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/SettlementFailedEvent" } } }
    SettlementRejectedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/SettlementRejectedEvent" } } }
    SettlementDelayedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/SettlementDelayedEvent" } } }
    SettlementCorrectedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/SettlementCorrectedEvent" } } }
    SettlementCancelledEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/SettlementCancelledEvent" } } }
    SettlementOutcomeReportedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/SettlementOutcomeReportedEvent" } } }
    ClearingStatementIssuedEvent:
      content: { application/json: { schema: { $ref: "#/components/schemas/ClearingStatementIssuedEvent" } } }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: { type: string, description: A stable code, e.g. `not_found`. }
        message: { type: string }
    Health:
      type: object
      additionalProperties: false
      required: [status, schemaVersion, persistence]
      properties:
        status: { const: ok }
        schemaVersion: { type: integer, description: The database schema version. }
        persistence: { $ref: "#/components/schemas/PersistenceMode" }
    PersistenceMode:
      enum: [durable, fast, memory]
    Date:
      type: string
      format: date
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, "null"]
      format: date-time
    Amount:
      type: string
      description: A decimal amount in major currency units, e.g. `"1500.00"`.
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"

    Side: { enum: [BUY, SELL] }
    OrderType: { enum: [LIMIT, MARKET] }
    OrderStatus: { enum: [OPEN, PARTIALLY_FILLED, FILLED, CANCELLED, REJECTED] }
    InstrumentRequest:
      type: object
      additionalProperties: false
      required: [id, symbol, currency, currencyScale]
      properties:
        id: { type: string }
        symbol: { type: string }
        mic: { type: [string, "null"], description: ISO 10383 market identifier code. }
        isin: { type: [string, "null"] }
        cusip: { type: [string, "null"] }
        currency: { type: string, description: ISO 4217 code. }
        currencyScale: { type: integer, minimum: 0, description: Decimals of the currency. }
        tickSizeMinor: { type: integer, minimum: 1, default: 1, description: One tick in minor currency units. }
        lotSize: { type: integer, minimum: 1, default: 1 }
        enabled: { type: boolean, default: true }
    Instrument:
      type: object
      additionalProperties: false
      required: [id, symbol, mic, isin, cusip, currency, currencyScale, tickSizeMinor, tickSize, lotSize, enabled]
      properties:
        id: { type: string }
        symbol: { type: string }
        mic: { type: [string, "null"] }
        isin: { type: [string, "null"] }
        cusip: { type: [string, "null"] }
        currency: { type: string }
        currencyScale: { type: integer }
        tickSizeMinor: { type: integer }
        tickSize: { $ref: "#/components/schemas/Amount" }
        lotSize: { type: integer }
        enabled: { type: boolean }
    Participant:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        settlement:
          type: [object, "null"]
          description: Free-form settlement details (at most 4 KiB), copied into `TradeExecuted`.
    OrderRequest:
      type: object
      additionalProperties: false
      required: [instrumentId, participantId, side, type, quantity]
      properties:
        clientOrderId: { type: [string, "null"], description: 1 to 64 characters; makes submission idempotent per participant. }
        instrumentId: { type: string }
        participantId: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        type: { $ref: "#/components/schemas/OrderType" }
        priceTicks: { type: [integer, "null"], description: Required for `LIMIT`, absent for `MARKET`. }
        quantity: { type: integer, minimum: 1 }
    Order:
      type: object
      additionalProperties: false
      required: [orderId, clientOrderId, instrumentId, participantId, side, type, priceTicks, price, quantity,
                 remainingQuantity, filledQuantity, status, sequence]
      properties:
        orderId: { type: string, format: uuid }
        clientOrderId: { type: [string, "null"] }
        instrumentId: { type: string }
        participantId: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        type: { $ref: "#/components/schemas/OrderType" }
        priceTicks: { type: [integer, "null"] }
        price: { type: [string, "null"] }
        quantity: { type: integer }
        remainingQuantity: { type: integer }
        filledQuantity: { type: integer }
        status: { $ref: "#/components/schemas/OrderStatus" }
        sequence: { type: integer }
        rejectReason: { enum: [SELF_TRADE, INSTRUMENT_DISABLED], description: Only on a rejection. }
        createdAt: { $ref: "#/components/schemas/Timestamp", description: "Only from `GET /api/orders/{id}`." }
        updatedAt: { $ref: "#/components/schemas/Timestamp", description: "Only from `GET /api/orders/{id}`." }
    OrderResult:
      type: object
      additionalProperties: false
      required: [order, executions, duplicate]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        executions:
          type: array
          items: { $ref: "#/components/schemas/Trade" }
        duplicate: { type: boolean }
    Trade:
      type: object
      additionalProperties: false
      required: [executionId, instrumentId, buyOrderId, sellOrderId, buyerId, sellerId, priceTicks, price, quantity,
                 currency, executedAt]
      properties:
        executionId: { type: string, format: uuid }
        instrumentId: { type: string }
        buyOrderId: { type: string, format: uuid }
        sellOrderId: { type: string, format: uuid }
        buyerId: { type: string }
        sellerId: { type: string }
        priceTicks: { type: integer }
        price: { $ref: "#/components/schemas/Amount" }
        quantity: { type: integer }
        currency: { type: string }
        executedAt: { $ref: "#/components/schemas/Timestamp" }
    Book:
      type: object
      additionalProperties: false
      required: [instrumentId, currency, enabled, bids, asks, lastSequence]
      properties:
        instrumentId: { type: string }
        currency: { type: string }
        enabled: { type: boolean }
        bids:
          description: Best (highest) first.
          type: array
          items: { $ref: "#/components/schemas/Level" }
        asks:
          description: Best (lowest) first.
          type: array
          items: { $ref: "#/components/schemas/Level" }
        lastSequence: { type: integer, description: The last order processed when the snapshot was taken. }
    Level:
      type: object
      additionalProperties: false
      required: [priceTicks, price, quantity, orders]
      properties:
        priceTicks: { type: integer }
        price: { $ref: "#/components/schemas/Amount" }
        quantity: { type: integer }
        orders: { type: integer }

    SettlementStatus: { enum: [PENDING, DELAYED, SETTLED, FAILED, REJECTED, CANCELLED, CORRECTED] }
    ClearingRefs:
      type: object
      additionalProperties: false
      required: [businessDate, buyer, seller]
      description: Which clearing statement and obligation each side of the trade appears on.
      properties:
        businessDate: { $ref: "#/components/schemas/Date" }
        buyer: { $ref: "#/components/schemas/PartyRef" }
        seller: { $ref: "#/components/schemas/PartyRef" }
    PartyRef:
      type: object
      additionalProperties: false
      required: [statementId, obligationId]
      properties:
        statementId: { type: string }
        obligationId: { type: string }
    Settlement:
      type: object
      additionalProperties: false
      required: [executionId, tradeSequence, instrumentId, buyerId, sellerId, quantity, priceTicks, currency,
                 settlementAmount, amountMinor, tradeDate, intendedSettlementDate, status, attempts, delays,
                 nextTransitionAt, settledAt, updatedAt]
      properties:
        executionId: { type: string, format: uuid }
        tradeSequence: { type: integer }
        instrumentId: { type: string }
        buyerId: { type: string }
        sellerId: { type: string }
        quantity: { type: integer }
        priceTicks: { type: integer }
        currency: { type: string }
        settlementAmount: { $ref: "#/components/schemas/Amount" }
        amountMinor: { type: integer }
        tradeDate: { $ref: "#/components/schemas/Date" }
        intendedSettlementDate: { $ref: "#/components/schemas/Date" }
        status: { $ref: "#/components/schemas/SettlementStatus" }
        attempts: { type: integer }
        delays: { type: integer }
        nextTransitionAt: { $ref: "#/components/schemas/NullableTimestamp" }
        settledAt: { $ref: "#/components/schemas/NullableTimestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        clearing: { $ref: "#/components/schemas/ClearingRefs" }
    ReportRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/SettlementStatus" }
        reference: { type: [string, "null"], description: The reporter's own identifier; a repeated reference is idempotent. }
        reason: { type: [string, "null"] }
        details: { type: [object, "null"] }
        occurredAt: { type: [string, "null"], format: date-time, description: Default the time of receipt. }
    Report:
      type: object
      additionalProperties: false
      required: [reportId, executionId, status, reference, reason, details, occurredAt, receivedAt]
      properties:
        reportId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SettlementStatus" }
        reference: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        details: { type: [object, "null"] }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        receivedAt: { $ref: "#/components/schemas/Timestamp" }
        duplicate: { type: boolean, description: Only in answer to a report. }
    SettlementDetail:
      type: object
      additionalProperties: false
      required: [executionId, simulated, simulatedEvents, external]
      properties:
        executionId: { type: string, format: uuid }
        simulated:
          oneOf:
            - { $ref: "#/components/schemas/Settlement" }
            - { type: "null" }
        simulatedEvents:
          type: array
          items: { $ref: "#/components/schemas/EventEnvelope" }
        external:
          type: array
          items: { $ref: "#/components/schemas/Report" }

    ClearingStatement:
      type: object
      additionalProperties: false
      required: [statementId, businessDate, participantId, timeZone, tradesFrom, cutoffAt, issuedAt, trades, obligations]
      properties:
        statementId: { type: string, description: "`CS:<businessDate>:<participant>`" }
        businessDate: { $ref: "#/components/schemas/Date" }
        participantId: { type: string }
        timeZone: { type: string }
        tradesFrom: { $ref: "#/components/schemas/Timestamp" }
        cutoffAt: { $ref: "#/components/schemas/Timestamp" }
        issuedAt: { $ref: "#/components/schemas/Timestamp" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/ClearingTrade" }
        obligations:
          type: array
          items: { $ref: "#/components/schemas/Obligation" }
    ClearingTrade:
      type: object
      additionalProperties: false
      required: [executionId, tradeSequence, instrumentId, side, quantity, priceTicks, currency, currencyScale,
                 amountMinor, amount, executedAt, tradeDate, intendedSettlementDate, obligationId]
      properties:
        executionId: { type: string, format: uuid }
        tradeSequence: { type: integer }
        instrumentId: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        quantity: { type: integer }
        priceTicks: { type: integer }
        currency: { type: string }
        currencyScale: { type: integer }
        amountMinor: { type: integer }
        amount: { $ref: "#/components/schemas/Amount" }
        executedAt: { $ref: "#/components/schemas/Timestamp" }
        tradeDate: { $ref: "#/components/schemas/Date" }
        intendedSettlementDate: { $ref: "#/components/schemas/Date" }
        obligationId: { type: string }
    Obligation:
      type: object
      additionalProperties: false
      required: [obligationId, instrumentId, intendedSettlementDate, currency, currencyScale, securitiesNet,
                 cashNetMinor, cashNet, tradeCount]
      description: Positive receives, negative delivers.
      properties:
        obligationId: { type: string, description: "`<statementId>:<instrument>:<settlementDate>`" }
        instrumentId: { type: string }
        intendedSettlementDate: { $ref: "#/components/schemas/Date" }
        currency: { type: string }
        currencyScale: { type: integer }
        securitiesNet: { type: integer }
        cashNetMinor: { type: integer }
        cashNet: { $ref: "#/components/schemas/Amount" }
        tradeCount: { type: integer }
    ClearingBreaks:
      type: object
      additionalProperties: false
      required: [statementId, businessDate, participantId, issued, issuedAt, breaks]
      properties:
        statementId: { type: string }
        businessDate: { $ref: "#/components/schemas/Date" }
        participantId: { type: string }
        issued: { type: boolean, description: "`false` for a late statement still waiting." }
        issuedAt: { $ref: "#/components/schemas/Timestamp" }
        breaks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, executionId, canonical, reported]
            properties:
              kind: { enum: [OMITTED_TRADE, QUANTITY_CHANGED, PRICE_CHANGED, PHANTOM_TRADE, LATE_STATEMENT] }
              executionId: { type: [string, "null"], format: uuid }
              canonical: { description: What the canonical trade says. }
              reported: { description: What the statement says instead. }

    ScenarioReport:
      type: object
      additionalProperties: false
      required: [name, passed, steps, eventLog]
      properties:
        name: { type: string }
        passed: { type: boolean }
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, step, passed, failures]
            properties:
              index: { type: integer, description: 0 is the setup. }
              step: { type: string }
              passed: { type: boolean }
              failures:
                type: array
                items: { type: string }
        eventLog:
          type: object
          additionalProperties: false
          required: [events, sha256]
          description: Equal fingerprints mean byte-identical event logs.
          properties:
            events: { type: integer }
            sha256: { type: string }

    Clock:
      type: object
      additionalProperties: false
      required: [mode, running, speed, now]
      properties:
        mode: { enum: [virtual, system] }
        running: { type: boolean }
        speed: { type: number, description: Simulated seconds per real second while running. }
        now: { $ref: "#/components/schemas/Timestamp" }
    ClockAdvance:
      type: object
      additionalProperties: false
      description: The given units are added up and must total more than zero.
      properties:
        days: { type: integer, minimum: 0 }
        hours: { type: integer, minimum: 0 }
        minutes: { type: integer, minimum: 0 }
        seconds: { type: integer, minimum: 0 }

    EventType:
      enum: [OrderAccepted, OrderRejected, OrderPartiallyFilled, OrderFilled, OrderCancelled, TradeExecuted,
             SettlementPending, SettlementCompleted, SettlementFailed, SettlementRejected, SettlementDelayed,
             SettlementCorrected, SettlementCancelled, SettlementOutcomeReported, ClearingStatementIssued]
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, sequence, eventType, schemaVersion, source, simulationId, aggregateId, correlationId,
                 occurredAt, payload]
      description: The canonical envelope, as stored, replayed and delivered. Deduplicate by `eventId`; `sequence` is the order.
      properties:
        eventId: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        eventType: { type: string }
        schemaVersion: { type: integer }
        source: { type: string, description: "`exchange`, `settlement-simulator`, `external`, `clearinghouse` or `payment-gateway`, `bank`." }
        simulationId: { type: [string, "null"] }
        aggregateId: { type: string }
        correlationId: { type: [string, "null"] }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        payload: { type: object }
    OrderEventPayload:
      type: object
      additionalProperties: false
      required: [orderId, clientOrderId, instrumentId, participantId, side, type, priceTicks, price, quantity,
                 remainingQuantity, filledQuantity, status, sequence]
      properties:
        orderId: { type: string, format: uuid }
        clientOrderId: { type: [string, "null"] }
        instrumentId: { type: string }
        participantId: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        type: { $ref: "#/components/schemas/OrderType" }
        priceTicks: { type: [integer, "null"] }
        price: { type: [string, "null"] }
        quantity: { type: integer }
        remainingQuantity: { type: integer }
        filledQuantity: { type: integer }
        status: { $ref: "#/components/schemas/OrderStatus" }
        sequence: { type: integer }
        rejectReason: { enum: [SELF_TRADE, INSTRUMENT_DISABLED] }
        cancelReason: { enum: [REQUESTED, MARKET_REMAINDER] }
        executionId: { type: string, format: uuid, description: On a resting order's fill event. }
    TradeExecutedPayload:
      type: object
      additionalProperties: false
      required: [executionId, instrumentId, instrument, buyOrderId, sellOrderId, buyerId, sellerId, buyerSettlement,
                 sellerSettlement, priceTicks, price, quantity, currency, currencyScale, tickSizeMinor, executedAt]
      properties:
        executionId: { type: string, format: uuid }
        instrumentId: { type: string }
        instrument:
          type: object
          additionalProperties: false
          required: [id, symbol, mic, isin, cusip, currency]
          description: A snapshot as of execution time.
          properties:
            id: { type: string }
            symbol: { type: string }
            mic: { type: [string, "null"] }
            isin: { type: [string, "null"] }
            cusip: { type: [string, "null"] }
            currency: { type: string }
        buyOrderId: { type: string, format: uuid }
        sellOrderId: { type: string, format: uuid }
        buyerId: { type: string }
        sellerId: { type: string }
        buyerSettlement: { type: [object, "null"], description: The buyer's settlement details at execution time. }
        sellerSettlement: { type: [object, "null"] }
        priceTicks: { type: integer }
        price: { $ref: "#/components/schemas/Amount" }
        quantity: { type: integer }
        currency: { type: string }
        currencyScale: { type: integer }
        tickSizeMinor: { type: integer }
        executedAt: { $ref: "#/components/schemas/Timestamp" }
    SettlementPayloadBase:
      type: object
      required: [executionId, tradeSequence, instrumentId, buyerId, sellerId, quantity, priceTicks, currency,
                 settlementAmount, amountMinor, tradeDate, intendedSettlementDate, status, attempt]
      properties:
        executionId: { type: string, format: uuid }
        tradeSequence: { type: integer }
        instrumentId: { type: string }
        buyerId: { type: string }
        sellerId: { type: string }
        quantity: { type: integer }
        priceTicks: { type: integer }
        currency: { type: string }
        settlementAmount: { $ref: "#/components/schemas/Amount" }
        amountMinor: { type: integer }
        tradeDate: { $ref: "#/components/schemas/Date" }
        intendedSettlementDate: { $ref: "#/components/schemas/Date" }
        status: { $ref: "#/components/schemas/SettlementStatus" }
        attempt: { type: integer }
        clearing: { $ref: "#/components/schemas/ClearingRefs" }
    SettlementOutcomeReportedPayload:
      type: object
      additionalProperties: false
      required: [reportId, executionId, status, reference, reason, details, receivedAt]
      properties:
        reportId: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SettlementStatus" }
        reference: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        details: { type: [object, "null"] }
        receivedAt: { $ref: "#/components/schemas/Timestamp" }

    OrderAcceptedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: OrderAccepted }
        source: { const: exchange }
        payload: { $ref: "#/components/schemas/OrderEventPayload" }
    OrderRejectedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: OrderRejected }
        source: { const: exchange }
        payload: { allOf: [{ $ref: "#/components/schemas/OrderEventPayload" }], required: [rejectReason] }
    OrderPartiallyFilledEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: OrderPartiallyFilled }
        source: { const: exchange }
        payload: { $ref: "#/components/schemas/OrderEventPayload" }
    OrderFilledEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: OrderFilled }
        source: { const: exchange }
        payload: { $ref: "#/components/schemas/OrderEventPayload" }
    OrderCancelledEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: OrderCancelled }
        source: { const: exchange }
        payload: { allOf: [{ $ref: "#/components/schemas/OrderEventPayload" }], required: [cancelReason] }
    TradeExecutedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: TradeExecuted }
        source: { const: exchange }
        payload: { $ref: "#/components/schemas/TradeExecutedPayload" }
    SettlementPendingEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: SettlementPending }
        source: { const: settlement-simulator }
        payload:
          allOf: [{ $ref: "#/components/schemas/SettlementPayloadBase" }]
          required: [settlementDays]
          properties:
            settlementDays: { type: integer, description: The cycle applied, T+N business days. }
          unevaluatedProperties: false
    SettlementCompletedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: SettlementCompleted }
        source: { const: settlement-simulator }
        payload:
          allOf: [{ $ref: "#/components/schemas/SettlementPayloadBase" }]
          required: [settledAt]
          properties:
            settledAt: { $ref: "#/components/schemas/Timestamp" }
          unevaluatedProperties: false
    SettlementFailedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: SettlementFailed }
        source: { const: settlement-simulator }
        payload:
          allOf: [{ $ref: "#/components/schemas/SettlementPayloadBase" }]
          required: [reason]
          properties:
            reason: { const: SIMULATED_FAILURE }
          unevaluatedProperties: false
    SettlementRejectedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: SettlementRejected }
        source: { const: settlement-simulator }
        payload:
          allOf: [{ $ref: "#/components/schemas/SettlementPayloadBase" }]
          required: [reason]
          properties:
            reason: { enum: [SIMULATED_REJECTION, AMOUNT_OUT_OF_RANGE] }
          unevaluatedProperties: false
    SettlementDelayedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: SettlementDelayed }
        source: { const: settlement-simulator }
        payload:
          allOf: [{ $ref: "#/components/schemas/SettlementPayloadBase" }]
          required: [previousIntendedSettlementDate, delayBusinessDays]
          properties:
            previousIntendedSettlementDate: { $ref: "#/components/schemas/Date" }
            delayBusinessDays: { type: integer, minimum: 1 }
          unevaluatedProperties: false
    SettlementCorrectedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: SettlementCorrected }
        source: { const: settlement-simulator }
        payload:
          allOf: [{ $ref: "#/components/schemas/SettlementPayloadBase" }]
          required: [reason, previousSettlementAmount, previousAmountMinor]
          properties:
            reason: { const: SIMULATED_CORRECTION }
            previousSettlementAmount: { $ref: "#/components/schemas/Amount" }
            previousAmountMinor: { type: integer }
          unevaluatedProperties: false
    SettlementCancelledEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: SettlementCancelled }
        source: { const: settlement-simulator }
        payload:
          allOf: [{ $ref: "#/components/schemas/SettlementPayloadBase" }]
          required: [reason]
          properties:
            reason: { const: SIMULATED_CANCELLATION }
          unevaluatedProperties: false
    SettlementOutcomeReportedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: SettlementOutcomeReported }
        source: { const: external }
        payload: { $ref: "#/components/schemas/SettlementOutcomeReportedPayload" }
    ClearingStatementIssuedEvent:
      allOf: [{ $ref: "#/components/schemas/EventEnvelope" }]
      properties:
        eventType: { const: ClearingStatementIssued }
        source: { const: clearinghouse }
        payload: { $ref: "#/components/schemas/ClearingStatement" }

    DeliveryStatus: { enum: [PENDING, IN_FLIGHT, DELIVERED, DEAD] }
    WebhookRequest:
      type: object
      additionalProperties: false
      required: [url, eventTypes]
      properties:
        url: { type: string, format: uri, description: http or https. }
        eventTypes:
          type: array
          minItems: 1
          items: { type: string }
          description: Known event types of this service; duplicates are removed.
        secret: { type: [string, "null"], minLength: 16, maxLength: 256, description: When set, every delivery is signed. Never returned. }
        ordered: { type: boolean, default: false, description: One delivery at a time, in event sequence order. }
    WebhookUpdate:
      type: object
      additionalProperties: false
      properties:
        url: { type: [string, "null"], format: uri }
        eventTypes:
          type: [array, "null"]
          items: { type: string }
        ordered: { type: [boolean, "null"] }
        enabled: { type: [boolean, "null"] }
        paused: { type: [boolean, "null"] }
    SecretRotation:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret: { type: string, minLength: 16, maxLength: 256 }
        graceSeconds: { type: integer, minimum: 0, maximum: 604800, default: 3600, description: How long the previous secret stays valid. }
    SubscriptionFields:
      type: object
      required: [id, url, eventTypes, enabled, paused, signed, ordered, createdAt, source]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        eventTypes:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        paused: { type: boolean, description: Deliveries are recorded but held until unpaused. }
        signed: { type: boolean }
        ordered: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        faults: { $ref: "#/components/schemas/FaultPolicy" }
        name: { type: string, description: The name it is declared under in `webhooks.subscriptions`. }
        source: { enum: [api, config] }
        previousSecretValidUntil: { $ref: "#/components/schemas/Timestamp" }
        deleted: { const: true, description: Shown only when listing with `includeDeleted=true`. }
    Subscription:
      allOf: [{ $ref: "#/components/schemas/SubscriptionFields" }]
      unevaluatedProperties: false
    SubscriptionDetail:
      allOf: [{ $ref: "#/components/schemas/SubscriptionFields" }]
      required: [deliveries]
      properties:
        deliveries:
          type: object
          additionalProperties: false
          required: [pending, inFlight, delivered, dead, oldestUnfinished]
          properties:
            pending: { type: integer }
            inFlight: { type: integer }
            delivered: { type: integer }
            dead: { type: integer }
            oldestUnfinished:
              description: How far behind the consumer is.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [eventSequence, occurredAt]
                  properties:
                    eventSequence: { type: integer }
                    occurredAt: { $ref: "#/components/schemas/Timestamp" }
                - { type: "null" }
      unevaluatedProperties: false
    Delivery:
      type: object
      additionalProperties: false
      required: [deliveryId, subscriptionId, url, eventSequence, eventId, eventType, status, attempts, lastError,
                 nextAttemptAt, deliveredAt]
      properties:
        deliveryId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        url: { type: string }
        eventSequence: { type: integer }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        attempts: { type: integer }
        lastError: { type: [string, "null"] }
        nextAttemptAt: { $ref: "#/components/schemas/NullableTimestamp" }
        deliveredAt: { $ref: "#/components/schemas/NullableTimestamp" }
    Attempt:
      type: object
      additionalProperties: false
      required: [id, deliveryId, subscriptionId, url, eventSequence, eventId, eventType, attempt, outcome, faults,
                 httpStatus, error, at]
      properties:
        id: { type: integer }
        deliveryId: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        url: { type: string }
        eventSequence: { type: integer }
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        attempt: { type: integer, minimum: 1 }
        outcome: { enum: [SENT, HELD] }
        faults:
          type: array
          items: { type: string }
          description: e.g. `missing:payload.price`, `duplicate`, `delay:500ms`, `held:1000ms`.
        body: { description: The body sent, only when a fault changed it. }
        httpStatus: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        at: { $ref: "#/components/schemas/Timestamp" }
    FaultPolicy:
      type: object
      additionalProperties: false
      properties:
        seed: { type: integer, minimum: 0, default: 0 }
        missing: { $ref: "#/components/schemas/FieldFault" }
        nulls: { $ref: "#/components/schemas/FieldFault" }
        invalid: { $ref: "#/components/schemas/FieldFault" }
        duplicateProbability: { type: number, minimum: 0, maximum: 1, default: 0 }
        delay:
          type: object
          additionalProperties: false
          required: [ms]
          properties:
            probability: { type: number, minimum: 0, maximum: 1, default: 1 }
            ms: { type: integer, minimum: 0, maximum: 10000 }
        outOfOrder:
          type: object
          additionalProperties: false
          required: [holdMs]
          description: Not for an ordered subscription.
          properties:
            probability: { type: number, minimum: 0, maximum: 1, default: 1 }
            holdMs: { type: integer, minimum: 0, maximum: 3600000 }
    FieldFault:
      type: object
      additionalProperties: false
      description: Damage to the listed fields, or to one random leaf field when there are none.
      properties:
        probability: { type: number, minimum: 0, maximum: 1, default: 1 }
        paths:
          type: array
          items: { type: string }
    Queued:
      type: object
      additionalProperties: false
      required: [queued]
      properties:
        queued: { type: integer }
    Retried:
      type: object
      additionalProperties: false
      required: [retried]
      properties:
        retried: { type: integer }
