# The payment-gateway as the trading demo runs it. Mounted at /etc/gateway/gateway.yaml, layered over the gateway's
# built-in defaults.
# Webhook subscriptions, one per consuming translation slice, signed with the shared demo secret, delivered to the demo
# on the host (instance 1); every slice also reads the event log. Unordered (D11).
webhooks:
  subscriptions:
    # funding/external_systems/payment_gateway (PaymentGatewayEvents)
    - name: demo-funding
      url: http://host.docker.internal:8080/webhooks/payment-gateway/funding
      event_types: [PaymentPending, PaymentCompleted, PaymentFailed, PaymentReturned]
      secret_file: /run/secrets/webhook_secret
    # reconciliation/external_systems/bank (BankStatements)
    - name: demo-reconciliation
      url: http://host.docker.internal:8080/webhooks/payment-gateway/bank-statements
      event_types: [BankStatementIssued]
      secret_file: /run/secrets/webhook_secret
clock:
  # Follows the exchange's clock (SR-27): its reading, speed and running state, polled from GET /api/clock. One
  # business time for both simulators, also across restarts. A following clock refuses changes of its own - change
  # the exchange's.
  mode: follow
  follow: { url: "http://exchange:8080", poll_interval_ms: 250 }
# The exchange's business-day calendar, holidays included (SR-35), read from its GET /api/calendar at startup - the
# clock's follow URL. Statements, value dates and return delays then fall on the exchange's business days. Restart the
# gateway after changing the exchange's holidays.
calendar:
  mode: follow
payments:
  currencies: { USD: 2 }
  deposit: { fail_probability: 0.0, min_delay_seconds: 60, max_delay_seconds: 1800 }
  withdrawal: { fail_probability: 0.0, min_delay_seconds: 600, max_delay_seconds: 14400 }
  return_probability: 0.0
statement:
  cutoff: "16:30"
  time_zone: America/New_York
  opening_balances: { USD: "10000000.00" }
test_control:
  enabled: true
