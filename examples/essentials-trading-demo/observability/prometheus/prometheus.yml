# The demo's metrics do not come through here as a scrape: the application pushes them over OTLP to
# the collector, which remote-writes them into this Prometheus. The only scrape is Prometheus itself.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
