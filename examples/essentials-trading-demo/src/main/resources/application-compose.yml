spring:
  docker:
    compose:
      enabled: true
      file: classpath:compose.yml
      # start-only, not the default start-and-stop, because more than one instance shares this
      # database. Under the default, whichever instance started PostgreSQL takes it down with it on
      # shutdown, and every surviving instance then logs connection refusals forever — the engine
      # reconnects rather than dying (an owner that dies holds its leases), Hikari waits out its 30s
      # connectionTimeout, and the CDC tailer backs off and retries. All correct behaviour for a
      # transient outage, and unbounded noise for one that is permanent.
      #
      # The database therefore outlives the demo. Stop it with `docker compose down` (add `-v` to
      # discard the event store) when finished.
      lifecycle-management: start-only
  datasource:
    url: jdbc:postgresql://localhost:5432/essentials-trading-demo
    username: essentials
    password: password
    driver-class-name: org.postgresql.Driver
    # Headroom over Hikari's default of 10. The shard-owned queue runtime holds 3 connections
    # permanently (2 pumps + 1 listener) and logs its share of the pool at start-up; the rest is shared
    # by event-store subscriptions, both load generators, lease renewal and the projections. Until the
    # starter passed its runtime to its queues there were two runtimes holding 6, and a restart against
    # a database the demo had already run on failed start-up with the pool exhausted.
    #
    # 40 since the order flow runs 8 / 8 / 8 inbox consumers (trading-demo.orders.consumers below), each holding a
    # connection while it handles a message: on 20 they starved each other and did no better than the defaults (EF-2,
    # docs/key-partitioned-event-processing.md section 5, M5). Two instances at 40 still fit PostgreSQL's default
    # max_connections of 100.
    hikari:
      maximum-pool-size: 40

essentials:
  immutable-jackson-module-enabled: true
  unit-of-work:
    # The compose PostgreSQL runs with its stock default, READ COMMITTED, so asking for it explicitly only costs a
    # SHOW TRANSACTION ISOLATION LEVEL round trip per transaction (~620 000 in one order-flow run; 13 % more completed
    # orders/s without them - EF-2 doc §5)
    transaction-isolation: database-default
  scheduler:
    enabled: true
    number-of-threads: 2
  reactive:
    event-bus-backpressure-buffer-size: 1024
    overflow-max-retries: 20
    queued-task-cap-factor: 1.5
  multi-table-change-listener:
    filter-duplicate-notifications: true
    polling-interval: 100ms
  durable-queues:
    shared-queue-table-name: durable_queues
    polling-delay-interval-increment-factor: 0.5
    max-polling-interval: 2s
    verbose-tracing: false
  # The shard-owned queue engine. The queue is declared here as data — name to unordered shard
  # count — because a name in a YAML file cannot become a bean name without inventing a mapping
  # that would then be part of the contract. The ordered lane takes no count: it routes on its own
  # fixed space, recorded per queue when the queue is created.
  shard-owned-queue:
    initialize-schema: true
    pump-threads: 2
    # No `queues:` list. Nothing here needs one: the DurableQueues adapter registers the queues the
    # framework invents, and QueueLoadGenerator registers its own through
    # ShardOwnedQueueFactory.register, so its name lives in that class rather than in two places that
    # have to agree. Listing a queue here is for one an application wants to exist before anything
    # touches it — `name: <unordered shard count>`, with `ordered-units.<name>` to size the other lane.
    # Run the application's DurableQueues on this engine, so Inbox, Outbox and every
    # EventProcessor's projections are delivered by it. Set to false to run the same demo on
    # PostgresqlDurableQueues instead — both implement the interface, so it is an A/B.
    #
    # This is the only line needed. The queues the framework invents — Inbox:<processor>,
    # <processor>:queue, DefaultCommandQueue — register themselves on first use with
    # auto-register-shard-count unordered shards, which defaults to 4.
    durable-queues-enabled: true

  fenced-lock-manager:
    fenced-locks-table-name: fenced_locks
    lock-confirmation-interval: 5s
    lock-time-out: 12s
    release-acquired-locks-in-case-of-i-o-exceptions-during-lock-confirmation: false
  event-store:
    identifier-column-type: text
    json-column-type: jsonb
    use-event-stream-gap-handler: true
    archives:
      enabled: true
    subscription-manager:
      # Events per event-store read for every subscription (projections, processors, the harness). It was 5, which
      # made a batched subscription read a 100-event batch in ~21 queries (plus as many gap-table lookups) and capped
      # the EF-2 forwarder measurement; see docs/key-partitioned-event-processing.md. The starter's default is 10.
      event-store-polling-batch-size: 100
      snapshot-resume-points-every: 2s
      event-store-polling-interval: 200
    snapshots:
      enabled: true
    closing-books:
      enabled: true
    cdc:
      # CDC is OFF by default (CdcProperties#enabled = false) — it needs database-side setup the
      # framework won't assume. The demo opts in, and the compose Postgres is started with
      # `wal_level=logical`, `max_replication_slots=10` and `max_wal_senders=10` (see compose.yml)
      # - and `max_slot_wal_keep_size=2GB`, so a slot nobody reads invalidates instead of filling the disk -
      # with a superuser role, which covers the server-side prerequisites.
      enabled: true
      #
      # The pgoutput publication is still NOT created by the framework unless auto-manage is
      # switched on. Without a pre-created publication the tailer logs
      #   "pgoutput publication 'essentials_cdc_publication' does not exist"
      # and mode=AUTO silently falls back to polling. The demo lets the framework own the
      # publication so a plain `docker compose up` gives a working CDC path with no DBA step.
      #
      # FOR_TABLE_LIST creates the publication with an explicit list of the registered event-stream
      # tables, so pgoutput filters transactions that only touch non-event tables (durable_queues,
      # fenced_locks, TTL, …) server-side. It requires only table ownership; the compose Postgres
      # user is the image superuser, so either mode would work here.
      #
      # Note: auto-manage runs once at tailer startup. The demo's aggregate repositories are beans,
      # so their event-stream tables are registered before the tailer starts — but aggregates
      # registered after startup are not added to the publication without a restart.
      pg-output:
        publication:
          auto-manage: true
          mode: FOR_TABLE_LIST
      wal-parser-mode: bytes
      inbox-ttl-duration-days: 1

trading-demo:
  orders:
    # The order flow's two EventProcessors and the exchange reports' inbox. Batching the forward pays only together
    # with more inbox consumers; together they took the order flow from ~180 to ~366 completed orders/s (EF-2,
    # docs/key-partitioned-event-processing.md section 5, "Batched forward, built and measured").
    consumers:
      exchange-router: 8
      ledger: 8
      exchange-reports: 8
    forwarding:
      batch-size: 100
  # The projections (config/TradingDemoViewEventProcessor) handle up to this many events per unit of work instead of one
  # (ViewEventProcessor#getDirectHandlingBatchSize; docs/view-event-processor-batched-handling.md). Phase 6 measured the
  # order list (OrdersProjection) falling 5 000-7 500 events behind in a business day at 300 orders/s rushes.
  views:
    direct-handling-batch-size: 100
