spring:
  application:
    name: essentials-trading-demo

logging:
  level:
    root: INFO
    org.springframework: INFO
    dk.trustworks.essentials: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Actuator defaults show-components to `never`, which makes /actuator/health/cdc return 404
      # even when CdcHealthIndicator is wired. The demo exposes components so the CDC health check
      # is actually reachable.
      show-components: always
      show-details: always

trading-demo:
  # Drives the shard-owned queue engine on BOTH lanes at once: unordered price ticks and
  # per-account ordered activity. Off by default so the demo still starts on a small machine;
  # POST /api/admin/queue-load/start turns it on, and /spike sends a burst.
  queue-load:
    enabled: true
    queue-name: trading-events
    shard-count: 4
    sustained-interval: 250ms
    sustained-batch: 10
    spike-size: 5000
    key-count: 200
    handler-delay: 1ms
    parallel-consumers: 8
  accounts:
    closing-books:
      mode: event-count-or-time-boundary
      event-threshold: 100
      time-boundary: end-of-month
      zone-id: Europe/Copenhagen
  simulation:
    enabled: true
    account-count: 3
    deposits-per-account: 2
    settlements-per-account: 1
    instrument-count: 2
    # The accounts' opening period is derived from the configured closing-books time boundary, not configured
    # here: a hardcoded period id ages into the past and makes every later evaluation report skipped periods.
    # ACC-DEMO-001 is rolled by the policy, ACC-DEMO-002 by an explicit command, ACC-DEMO-003 not at all.
    max-policy-driven-events: 500
  risk-approval:
    # How long the stubbed risk service blocks the message handler that calls it. The handler is declared
    # @MessageHandler(unitOfWork = UnitOfWorkMode.NONE), so it holds no database connection while it waits — raise this
    # to watch a consumer thread sit on an external call for that long without costing the pool anything.
    #
    # It must stay well below essentials.durable-queues.message-handling-timeout (30s by default): past that
    # the in-flight message is reset as stuck and redelivered while the first attempt is still blocked.
    latency: 500ms
    # Symbols the stub refuses, so the rejection path is demonstrable without a random outcome. MSFT is the second
    # instrument the bootstrap seeds, so a freshly started demo shows one approved and one rejected instrument.
    rejected-symbols:
      - MSFT
  load:
    enabled: false
    trade-interval: 2s
    price-update-interval: 1s
    max-generated-trades: 500
    price-jitter:
      min: 3
      max: 9
