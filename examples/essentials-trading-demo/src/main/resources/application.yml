spring:
  application:
    name: essentials-trading-demo

logging:
  level:
    root: INFO
    org.springframework: INFO
    dk.trustworks.essentials: INFO

management:
  # spring-boot-starter-opentelemetry is on the classpath for the `observability` profile, which is the
  # only place export is turned on. Off here, so a plain run and every test that boots the context do
  # not spend each export step and each shutdown failing to reach a collector that is not running.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Actuator defaults show-components to `never`, which makes /actuator/health/cdc return 404
      # even when CdcHealthIndicator is wired. The demo exposes components so the CDC health check
      # is actually reachable.
      show-components: always
      show-details: always

trading-demo:
  identity:
    # Registered at startup when absent (_demo_harness/DemoUsersSeeder). Demo values, like the simulators' webhook
    # secret: change them for anything but a local demo. The operator may do everything; customers only reach
    # /api/accounts/** for their own accounts.
    seed-users:
      - user-id: USR-OPERATOR
        email: operator@demo.local
        display-name: Demo Operator
        roles: [OPERATOR]
        password: operator-demo-password
      - user-id: USR-ALICE
        email: alice@demo.local
        display-name: Alice Customer
        roles: [CUSTOMER]
        password: alice-demo-password
      - user-id: USR-BOB
        email: bob@demo.local
        display-name: Bob Customer
        roles: [CUSTOMER]
        password: bob-demo-password
  # Drives the shard-owned queue engine on BOTH lanes at once: unordered price ticks and
  # per-account ordered activity. Off by default so the demo still starts on a small machine;
  # POST /api/admin/queue-load/start turns it on, and /spike sends a burst.
  queue-load:
    enabled: true
    queue-name: trading-events
    shard-count: 4
    sustained-interval: 250ms
    sustained-batch: 10
    spike-size: 5000
    key-count: 200
    handler-delay: 1ms
    parallel-consumers: 8
  risk-approval:
    # How long the stubbed risk service blocks the message handler that calls it. The handler is declared
    # @MessageHandler(unitOfWork = UnitOfWorkMode.NONE), so it holds no database connection while it waits — raise this
    # to watch a consumer thread sit on an external call for that long without costing the pool anything.
    #
    # It must stay well below essentials.durable-queues.message-handling-timeout (30s by default): past that
    # the in-flight message is reset as stuck and redelivered while the first attempt is still blocked.
    latency: 500ms
    # Symbols the stub refuses, so the rejection path is demonstrable without a random outcome. MSFT is one of the
    # instruments the exchange lists (simulators/exchange.yaml), so a demo on the simulators shows it rejected and the
    # others approved.
    rejected-symbols:
      - MSFT

essentials:
  # The shard-owned queue engine is off by default in its starter; the demo always runs it, since
  # QueueLoadGenerator drives it and the adapter can back DurableQueues. Tuning lives in application-compose.yml.
  shard-owned-queue:
    enabled: true
  eventstore:
    causation:
      # Causation is recorded by default; the index behind "what did this event cause?" is opt-in. The demo turns it
      # on so the admin console's Event causation page can walk both directions.
      index-enabled: true
