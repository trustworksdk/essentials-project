schemaVersion: "1.1"
slice: accounts.account_generation_events
kind: view
bc: accounts
owner: accounts-team
status: live
summary: Serve the raw event stream of one books generation of a account, straight from the event store.
generator: essentials
language: java

serves: [GetAccountGenerationEvents]
endpoints:
  - { method: GET, path: "/api/admin/accounts/{accountId}/generations/{generation}/events", auth: anonymous }
reads:
  - { name: ApiClosingBooksGenerationEventStream }
projections: []
invariants:
  - id: INV-AGE-1
    text: "An unknown generation fails with 'Couldn't resolve generation <n> for account <id>', never as an empty stream"
    enforcedBy: AccountGenerationEventStreamQuery
forbidden:
  - cross-slice-internal:accounts
tests:
  unit: { present: false }
  integration: { present: false }
  contract: { present: false }
