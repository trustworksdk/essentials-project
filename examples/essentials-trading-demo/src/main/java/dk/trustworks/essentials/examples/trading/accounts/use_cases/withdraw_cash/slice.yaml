schemaVersion: "1.1"
slice: accounts.withdraw_cash
kind: command
bc: accounts
owner: accounts-team
status: live
summary: "A withdrawal completed at the bank: consume its hold and debit settled cash."
generator: essentials
language: java

handles: [WithdrawCash]
# AccountBooksClosed/AccountOpened are emitted when the ON_ACCESS closing-books policy rolls the account while it is
# being loaded for this command.
publishes: [CashWithdrawn, AccountBooksClosed, AccountOpened]
writes: [Account]
reads:
  - { name: Account }
endpoints:
  - { method: POST, path: "/api/admin/accounts/{accountId}/withdrawals", auth: operator }
forbidden:
  - cross-slice-internal:accounts
tests:
  unit: { present: true }
  integration: { present: true }
  contract: { present: false }
