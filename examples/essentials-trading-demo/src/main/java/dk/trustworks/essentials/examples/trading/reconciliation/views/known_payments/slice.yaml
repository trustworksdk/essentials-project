schemaVersion: "1.1"
slice: reconciliation.known_payments
kind: view
bc: reconciliation
owner: reconciliation-team
status: live
summary: "The brokerage's payments as reconciliation checks a bank statement against them."
generator: essentials
language: java

serves: []
endpoints: []
reads:
  - { name: KnownPayment }
projections:
  - name: KnownPaymentsProjection
    from: [DepositRequested, DepositInitiated, DepositCompleted, DepositReturnedByBank, WithdrawalRequested, WithdrawalInitiated, WithdrawalCompleted, WithdrawalReturnedByBank]
    consistency: eventual
    store: postgresql
forbidden:
  - cross-slice-internal:reconciliation
tests:
  unit: { present: false }
  integration: { present: true, path: "src/test/java/dk/trustworks/essentials/examples/trading/reconciliation/BankStatementReconciliationIT.java" }
  contract: { present: false }
