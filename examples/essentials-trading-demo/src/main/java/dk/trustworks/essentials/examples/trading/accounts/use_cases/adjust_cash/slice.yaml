schemaVersion: "1.1"
slice: accounts.adjust_cash
kind: command
bc: accounts
owner: accounts-team
status: live
summary: "An operator corrects settled cash, with a reason."
generator: essentials
language: java

handles: [AdjustCash]
# AccountBooksClosed/AccountOpened are emitted when the ON_ACCESS closing-books policy rolls the account while it is
# being loaded for this command.
publishes: [CashAdjusted, AccountBooksClosed, AccountOpened]
writes: [Account]
reads:
  - { name: Account }
endpoints:
  - { method: POST, path: "/api/admin/accounts/{accountId}/cash-adjustments", auth: operator }
forbidden:
  - cross-slice-internal:accounts
tests:
  unit: { present: true }
  integration: { present: true }
  contract: { present: false }
