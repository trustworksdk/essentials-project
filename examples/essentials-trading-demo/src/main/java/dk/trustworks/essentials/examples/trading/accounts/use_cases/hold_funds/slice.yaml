schemaVersion: "1.1"
slice: accounts.hold_funds
kind: command
bc: accounts
owner: accounts-team
status: live
summary: "Set cash aside for an open buy order or a pending withdrawal."
generator: essentials
language: java

handles: [HoldFunds]
# AccountBooksClosed/AccountOpened are emitted when the ON_ACCESS closing-books policy rolls the account while it is
# being loaded for this command.
publishes: [FundsHeld, AccountBooksClosed, AccountOpened]
writes: [Account]
reads:
  - { name: Account }
endpoints:
  - { method: POST, path: "/api/admin/accounts/{accountId}/holds", auth: operator }
forbidden:
  - cross-slice-internal:accounts
tests:
  unit: { present: true }
  integration: { present: true }
  contract: { present: false }
