schemaVersion: "1.1"
slice: market_data.latest_price
kind: view
bc: market_data
owner: market-data-team
status: live
summary: Serve the current price of one instrument from a read model projected in the transaction that appends each price event.
generator: essentials
language: java
lane: aggregate

serves: [GetLatestPrice]
endpoints:
  - { method: GET, path: "/api/admin/instrument-prices/{instrumentId}", auth: anonymous }
reads:
  - { name: LatestPrice }
projections:
  - name: LatestPriceProjection
    aggregateTypes: [InstrumentPrices]
    from: [PriceInitialized, PriceUpdated]
    consistency: strong
    store: postgresql
invariants:
  - id: INV-LP-1
    text: "The read is strongly consistent: the projection is an InTransactionEventProcessor, so a price's row commits with the event that set it, because the demo's bootstrap uses this query to decide whether seed data already exists and an eventually-consistent answer would let it seed twice"
    enforcedBy: LatestPriceProjection
  - id: INV-LP-2
    text: "A row never moves back to an older price: each write is guarded by the EventOrder the row was last written from"
    enforcedBy: LatestPriceProjection
forbidden:
  - cross-slice-internal:market_data
tier: cqrs-es
tests:
  unit: { present: false }
  integration: { present: false }
  contract: { present: false }
