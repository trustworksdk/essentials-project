schemaVersion: "1.1"
slice: orders.exchange
kind: external_system
bc: orders
owner: orders-team
status: live
summary: "Sends orders and cancel requests to the exchange and records what it reports back. The exchange-simulator under the simulators profile, a stub otherwise."
generator: essentials
language: java

reactsTo: [OrderPlaced, OrderCancelRequested, OrderExpiryRequested]
sends: [RecordExchangeAnswer, RecordFill, RecordCancellation, ExpireOrder]
reads:
  - { name: OpenDayOrders, via: OrdersQuery }
endpoints:
  - { method: POST, path: "/api/admin/orders/business-day-closed", auth: operator }
invariants:
  - id: INV-EX-1
    text: "The exchange is called with no UnitOfWork active, so no database connection is held for the duration of the call"
    enforcedBy: ExchangeOrderRouter
  - id: INV-EX-2
    text: "Every exchange report reaches the order through the Orders:ExchangeReports inbox, which redelivers a report that collided with another write"
    enforcedBy: ExchangeReports
  - id: INV-EX-3
    text: "A resubmitted order is answered as it was the first time (idempotent per orderId)"
    enforcedBy: StubExchangeGateway, SimulatorExchangeGateway
  - id: INV-EX-4
    text: "An unreachable exchange is retried within the retry budget, then the order is rejected EXCHANGE_UNAVAILABLE and its hold released"
    enforcedBy: ExchangeOrderRouter
forbidden:
  - cross-slice-internal:orders
tests:
  unit: { present: false }
  integration: { present: true, path: "src/test/java/dk/trustworks/essentials/examples/trading/orders/OrdersIT.java" }
  # Against the real exchange-simulator image; skips when the image is not built locally
  contract: { present: true, path: "src/test/java/dk/trustworks/essentials/examples/trading/orders/external_systems/exchange/SimulatorExchangeGatewayIT.java" }
