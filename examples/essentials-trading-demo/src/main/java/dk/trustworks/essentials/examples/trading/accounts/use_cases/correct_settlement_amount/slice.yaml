schemaVersion: "1.1"
slice: accounts.correct_settlement_amount
kind: command
bc: accounts
owner: accounts-team
status: live
summary: "The settlement of a settled trade was corrected: book the changed cash, cost basis or realized P&L."
generator: essentials
language: java

handles: [CorrectSettlementAmount]
# AccountBooksClosed/AccountOpened are emitted when the ON_ACCESS closing-books policy rolls the account while it is
# being loaded for this command.
publishes: [SettlementAmountCorrected, AccountBooksClosed, AccountOpened]
writes: [Account]
reads:
  - { name: Account }
endpoints:
  - { method: POST, path: "/api/admin/accounts/{accountId}/settlement-corrections", auth: operator }
forbidden:
  - cross-slice-internal:accounts
tests:
  unit: { present: true }
  integration: { present: true }
  contract: { present: false }
