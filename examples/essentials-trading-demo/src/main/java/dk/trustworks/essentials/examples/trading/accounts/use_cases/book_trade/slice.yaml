schemaVersion: "1.1"
slice: accounts.book_trade
kind: command
bc: accounts
owner: accounts-team
status: live
summary: "Book an execution as pending."
generator: essentials
language: java

handles: [BookTrade]
# AccountBooksClosed/AccountOpened are emitted when the ON_ACCESS closing-books policy rolls the account while it is
# being loaded for this command.
publishes: [TradeBooked, AccountBooksClosed, AccountOpened]
writes: [Account]
reads:
  - { name: Account }
endpoints:
  - { method: POST, path: "/api/admin/accounts/{accountId}/trade-bookings", auth: operator }
forbidden:
  - cross-slice-internal:accounts
tests:
  unit: { present: true }
  integration: { present: true }
  contract: { present: false }
