schemaVersion: "1.1"
slice: accounts.release_shares
kind: command
bc: accounts
owner: accounts-team
status: live
summary: "Release whatever remains of a share reservation, and close it."
generator: essentials
language: java

handles: [ReleaseShares]
# AccountBooksClosed/AccountOpened are emitted when the ON_ACCESS closing-books policy rolls the account while it is
# being loaded for this command.
publishes: [SharesReleased, AccountBooksClosed, AccountOpened]
writes: [Account]
reads:
  - { name: Account }
endpoints:
  - { method: POST, path: "/api/admin/accounts/{accountId}/share-reservation-releases", auth: operator }
forbidden:
  - cross-slice-internal:accounts
tests:
  unit: { present: true }
  integration: { present: true }
  contract: { present: false }
