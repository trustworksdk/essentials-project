schemaVersion: "1.1"
slice: orders.record_cancellation
kind: command
bc: orders
owner: orders-team
status: live
summary: "Record the exchange's cancellation of what was left of an order."
generator: essentials
language: java

handles: [RecordCancellation]
emits: [OrderCancelled, OrderClosed]
writes:
  - { name: Order }
endpoints: []
invariants:
  - id: INV-RC-1
    text: "A cancellation of an order that already closed adds nothing"
    enforcedBy: Order
forbidden:
  - cross-slice-internal:orders
tests:
  unit: { present: true, path: "src/test/java/dk/trustworks/essentials/examples/trading/orders/aggregates/OrderTest.java" }
  integration: { present: true, path: "src/test/java/dk/trustworks/essentials/examples/trading/orders/OrdersIT.java" }
  contract: { present: false }
