schemaVersion: "1.1"
slice: accounts.reverse_trade_booking
kind: command
bc: accounts
owner: accounts-team
status: live
summary: "Undo a booked, unsettled trade."
generator: essentials
language: java

handles: [ReverseTradeBooking]
# AccountBooksClosed/AccountOpened are emitted when the ON_ACCESS closing-books policy rolls the account while it is
# being loaded for this command.
publishes: [TradeBookingReversed, AccountBooksClosed, AccountOpened]
writes: [Account]
reads:
  - { name: Account }
endpoints:
  - { method: POST, path: "/api/admin/accounts/{accountId}/trade-booking-reversals", auth: operator }
forbidden:
  - cross-slice-internal:accounts
tests:
  unit: { present: true }
  integration: { present: true }
  contract: { present: false }
