schemaVersion: "1.1"
slice: market_data.update_price
kind: command
bc: market_data
owner: market-data-team
status: live
summary: Record a new market price for an instrument - the authoritative latest-price write path.
generator: essentials
language: java

handles: [UpdatePrice]
publishes: [PriceUpdated]
writes: [InstrumentPrice]
reads:
  - { name: InstrumentPrice }
endpoints:
  - { method: POST, path: "/api/admin/instrument-prices/{instrumentId}", auth: anonymous }
invariants:
  - id: INV-UP-1
    text: "A tick repeating the price already held is a no-op - an unchanged market must not lengthen the stream, and a redelivered command leaves no trace"
    enforcedBy: InstrumentPrice
  - id: INV-UP-2
    text: "A price must be greater than zero - enforced in the event's canonical constructor, so it also holds on replay"
    enforcedBy: InstrumentPriceEvent
  - id: INV-UP-3
    text: "Ticking an instrument whose price stream was never initialized fails - the handler loads via getPrice, never creating one"
    enforcedBy: UpdatePriceHandler
forbidden:
  - cross-slice-internal:market_data
  - benchmark-jdbc-price-table
tests:
  unit: { present: false }
  integration: { present: false }
  contract: { present: false }
