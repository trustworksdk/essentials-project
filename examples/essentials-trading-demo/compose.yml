networks:
  default:
    name: essentials-trading-demo

services:
  postgresql:
    container_name: essentials-trading-demo-postgresql
    image: essentials-postgres:17.5
    build:
      context: ../../
      dockerfile: docker/postgresql/Dockerfile
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: essentials
      POSTGRES_PASSWORD: password
      POSTGRES_DB: essentials-trading-demo
      POSTGRES_SHARED_PRELOAD_LIBRARIES: pg_cron
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron,pg_stat_statements", "-c", "cron.database_name=essentials-trading-demo", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
