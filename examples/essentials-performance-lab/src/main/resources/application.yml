spring:
  application:
    name: essentials-performance-lab
  datasource:
    url: jdbc:postgresql://localhost:5432/essentials_lab
    username: essentials
    password: essentials

essentials:
  scheduler:
    enabled: true
  eventstore:
    cdc:
      enabled: true
      mode: auto
  lab:
    mode: showcase
    scenario: catalog
    warmup: 10s
    duration: 30s
    producer-threads: 4
    subscriber-count: 5
    queue-count: 10
    aggregate-cardinality: 1000
    random-seed: 42
    metrics-output-file: ./target/perf-lab-metrics.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
