schemaVersion: "1.4"
slice: banking.account_balance
kind: view
bc: banking
owner: banking-team
status: live
summary: Serve the running balance per account from a projected read model.
generator: essentials
language: java
lane: aggregate

serves: [ListAccountBalances, GetAccountBalance]
endpoints:
  - { method: GET, path: /banking/accounts, auth: anonymous }
  - { method: GET, path: "/banking/accounts/{accountId}", auth: anonymous }
reads:
  - { name: AccountBalanceView }
projections:
  - name: AccountBalanceProjection
    aggregateTypes: [Accounts]
    from: [AccountOpened, AccountDeposited, AccountWithdrawn]
    consistency: eventual
    store: document-db
invariants:
  - id: INV-AB-1
    text: "Projecting an already-applied event is a no-op: each handler compares the event's EventOrder against the row's stored version before writing, so at-least-once delivery cannot double-count a balance"
    enforcedBy: AccountBalanceProjection
forbidden:
  - cross-slice-internal:banking
tier: cqrs-es
flow:
  - money-transfer
  - open-account
scenarios:
  - name: account balance view is projected from the account events
    given:
      - event: AccountOpened
        with:
          accountNumber: "001123456"
      - event: AccountDeposited
        with:
          depositedAmount: 250
      - event: AccountWithdrawn
        with:
          withdrawAmount: 100
    then:
      readModel: AccountBalanceView
      rows:
        - accountNumber: "001123456"
          balance: 150
    test: AccountBalanceViewIT#account_balance_view_is_projected_from_the_account_events
  - name: a later deposit adds to the projected balance
    given:
      - event: AccountOpened
      - event: AccountDeposited
        with:
          depositedAmount: 40
      - event: AccountDeposited
        with:
          depositedAmount: 10
    then:
      readModel: AccountBalanceView
      rows:
        - balance: 50
    test: AccountBalanceViewIT#the_projection_is_idempotent_when_an_event_is_redelivered
tests:
  unit: { present: false }
  integration: { present: true }
  contract: { present: false }
