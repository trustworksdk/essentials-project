<!--
  STATIC MOCKUP — not production code, not wired to anything.

  Purpose: settle the look and feel of the Thymeleaf + vanilla-JS admin UI before any templates exist.
  Open this file directly in a browser; there is no server, no build step, no dependencies.

  Fixtures below are hand-written against the committed contract
  (components/admin-api-spec/openapi/essentials-admin-api.yaml) — field names and nullability match the
  DTO schemas exactly, so the layout is judged against data of the real shape.

  In production the tables would be server-rendered by Thymeleaf and refreshed with fetch(); the
  rendering here is vanilla JS purely so one file can stand alone.
-->
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Essentials Admin</title>
    <style>
        /* ── Tokens ────────────────────────────────────────────────────────────────────────────
           Values from the data-viz reference palette. Light and dark are both selected sets:
           dark is the same hues re-stepped for the dark surface, never an automatic flip.        */
        :root {
            color-scheme: light;
            --surface-1: #fcfcfb;
            --page: #f9f9f7;
            --ink-primary: #0b0b0b;
            --ink-secondary: #52514e;
            --ink-muted: #898781;
            --gridline: #e1e0d9;
            --baseline: #c3c2b7;
            --border: rgba(11, 11, 11, 0.10);
            --accent: #2a78d6;            /* categorical slot 1 / sequential hue */
            --seq-track: #cde2fb;         /* sequential step 100 — track only, never data */
            --seq-fill: #2a78d6;          /* sequential step 450 */
            --success-text: #006300;
            /* Status palette — fixed, never themed. Always paired with an icon + label. */
            --status-good: #0ca30c;
            --status-warning: #fab219;
            --status-serious: #ec835a;
            --status-critical: #d03b3b;
            --radius: 8px;
            --font: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root:where(:not([data-theme="light"])) {
                color-scheme: dark;
                --surface-1: #1a1a19;
                --page: #0d0d0d;
                --ink-primary: #ffffff;
                --ink-secondary: #c3c2b7;
                --ink-muted: #898781;
                --gridline: #2c2c2a;
                --baseline: #383835;
                --border: rgba(255, 255, 255, 0.10);
                --accent: #3987e5;
                --seq-track: #184f95;
                --seq-fill: #3987e5;
                --success-text: #0ca30c;
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --surface-1: #1a1a19;
            --page: #0d0d0d;
            --ink-primary: #ffffff;
            --ink-secondary: #c3c2b7;
            --ink-muted: #898781;
            --gridline: #2c2c2a;
            --baseline: #383835;
            --border: rgba(255, 255, 255, 0.10);
            --accent: #3987e5;
            --seq-track: #184f95;
            --seq-fill: #3987e5;
            --success-text: #0ca30c;
        }

        /* ── Base ──────────────────────────────────────────────────────────────────────────── */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.5;
            color: var(--ink-primary);
            background: var(--page);
            display: grid;
            grid-template-columns: 232px 1fr;
            min-height: 100vh;
        }

        /* ── Sidebar ───────────────────────────────────────────────────────────────────────── */
        .sidebar {
            background: var(--surface-1);
            border-right: 1px solid var(--border);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand { padding: 0 8px; }
        .brand-name { font-weight: 600; letter-spacing: -0.01em; }
        .brand-sub { color: var(--ink-muted); font-size: 12px; }

        .nav { display: flex; flex-direction: column; gap: 2px; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 8px;
            border-radius: 6px;
            color: var(--ink-secondary);
            cursor: pointer;
            border: none;
            background: none;
            font: inherit;
            text-align: left;
            width: 100%;
        }

        .nav-item:hover { background: color-mix(in oklab, var(--ink-primary) 6%, transparent); }

        .nav-item[aria-current="page"] {
            background: color-mix(in oklab, var(--accent) 12%, transparent);
            color: var(--ink-primary);
            font-weight: 500;
        }

        .nav-item .ic { width: 16px; text-align: center; color: var(--ink-muted); }
        .nav-item[aria-current="page"] .ic { color: var(--accent); }

        /* A nav item the caller's roles do not permit: visible but inert, so the UI explains
           itself rather than silently hiding capability. */
        .nav-item[disabled] { opacity: 0.45; cursor: not-allowed; }

        .nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); padding: 0 8px; margin-bottom: 4px; }

        .sidebar-footer { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--ink-muted); }

        /* ── Main ──────────────────────────────────────────────────────────────────────────── */
        .main {
            padding: 20px 24px 48px;
            max-width: 1400px;
            /* A grid item's automatic minimum size is min-content, so a wide table would stretch this
               column past its track and put the whole page into horizontal scroll. */
            min-width: 0;
        }

        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
        .page-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
        .page-sub { color: var(--ink-secondary); margin: 2px 0 0; }
        .topbar-right { display: flex; align-items: center; gap: 8px; }

        .chip {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--ink-secondary);
            background: var(--surface-1);
            font-variant-numeric: tabular-nums;
        }

        .btn {
            font: inherit;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface-1);
            color: var(--ink-primary);
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover { background: color-mix(in oklab, var(--ink-primary) 5%, transparent); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-danger { color: var(--status-critical); border-color: color-mix(in oklab, var(--status-critical) 35%, var(--border)); }
        .btn-sm { font-size: 12px; padding: 3px 8px; }

        /* ── Card ──────────────────────────────────────────────────────────────────────────── */
        .card {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .card-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--gridline);
        }

        .card-title { font-weight: 600; font-size: 14px; }
        .card-note { color: var(--ink-muted); font-size: 12px; }
        .card-body { padding: 12px 14px; }
        .card-body.flush { padding: 0; }

        /* ── Stat tiles (KPI row) ──────────────────────────────────────────────────────────── */
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }

        .tile {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            /* An unexpectedly long value must not widen the grid track. */
            min-width: 0;
            overflow: hidden;
        }

        .tile-label { color: var(--ink-secondary); font-size: 12px; }
        /* Proportional figures for standalone numbers; tabular is reserved for columns. */
        .tile-value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; overflow-wrap: anywhere; }
        .tile-sub { color: var(--ink-muted); font-size: 12px; margin-top: 2px; }
        .tile-value.is-critical { color: var(--status-critical); }
        .tile-value.is-text { font-size: 18px; font-weight: 600; }

        /* ── Status badge — colour NEVER carries meaning alone: icon + label always ─────────── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .badge .dot { font-size: 11px; line-height: 1; }
        .badge-good { color: var(--success-text); background: color-mix(in oklab, var(--status-good) 10%, transparent); border-color: color-mix(in oklab, var(--status-good) 30%, var(--border)); }
        .badge-warning { color: var(--ink-primary); background: color-mix(in oklab, var(--status-warning) 18%, transparent); border-color: color-mix(in oklab, var(--status-warning) 45%, var(--border)); }
        .badge-serious { color: var(--ink-primary); background: color-mix(in oklab, var(--status-serious) 18%, transparent); border-color: color-mix(in oklab, var(--status-serious) 45%, var(--border)); }
        .badge-critical { color: var(--status-critical); background: color-mix(in oklab, var(--status-critical) 10%, transparent); border-color: color-mix(in oklab, var(--status-critical) 30%, var(--border)); }
        .badge-neutral { color: var(--ink-secondary); }

        /* ── Table ─────────────────────────────────────────────────────────────────────────── */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }

        th {
            text-align: left;
            font-weight: 500;
            font-size: 12px;
            color: var(--ink-secondary);
            padding: 8px 12px;
            border-bottom: 1px solid var(--baseline);
            white-space: nowrap;
            background: var(--surface-1);
        }

        td { padding: 8px 12px; border-bottom: 1px solid var(--gridline); vertical-align: middle; white-space: nowrap; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: color-mix(in oklab, var(--accent) 5%, transparent); }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
        .truncate { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nil { color: var(--ink-muted); }
        .actions { display: flex; gap: 6px; justify-content: flex-end; }

        /* A wide table scrolls horizontally; the action column must not scroll out of reach. */
        td.actions, th.sticky {
            position: sticky;
            right: 0;
            background: var(--surface-1);
            box-shadow: -1px 0 0 var(--gridline);
        }

        /* ── Inline magnitude bar (sequential, one hue) ─────────────────────────────────────
           Ranked magnitude where the label is long text → bar in the cell, not a chart.
           The number is always shown beside it (relief rule), so the bar is never the only
           carrier of the value.                                                              */
        .bar-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
        .bar-track { display: block; width: 84px; height: 8px; background: var(--seq-track); border-radius: 4px; overflow: hidden; flex: none; }
        .bar-fill { display: block; height: 100%; background: var(--seq-fill); border-radius: 0 4px 4px 0; }
        .bar-num { font-variant-numeric: tabular-nums; min-width: 68px; text-align: right; }

        /* ── Meter — a single ratio against a limit (not a 2-slice pie) ─────────────────────── */
        .meter-row { display: grid; grid-template-columns: 1fr 160px 64px; gap: 12px; align-items: center; padding: 7px 0; }
        .meter-row + .meter-row { border-top: 1px solid var(--gridline); }
        .meter-track { display: block; height: 8px; background: var(--seq-track); border-radius: 4px; overflow: hidden; }
        .meter-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--seq-fill); }
        .meter-val { font-variant-numeric: tabular-nums; text-align: right; }

        /* ── Key/value grid (CDC configuration, slot detail) ───────────────────────────────── */
        .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 28px; }
        /* min-width: 0 lets the flex item shrink below its min-content width; overflow-wrap gives an
           unbreakable token (slot names, QUARANTINE_AND_CONTINUE) a break opportunity. Without both,
           a long value paints over the neighbouring grid column. */
        .kv-item { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--gridline); min-width: 0; }
        .kv-key { color: var(--ink-secondary); flex: 0 0 auto; }
        .kv-val { font-variant-numeric: tabular-nums; text-align: right; min-width: 0; overflow-wrap: anywhere; }

        /* ── States ────────────────────────────────────────────────────────────────────────── */
        .empty { padding: 28px 14px; text-align: center; color: var(--ink-secondary); }
        .empty-icon { font-size: 20px; color: var(--ink-muted); }

        .banner {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 16px;
            font-size: 13px;
        }

        .banner-warning { background: color-mix(in oklab, var(--status-warning) 12%, var(--surface-1)); border-color: color-mix(in oklab, var(--status-warning) 40%, var(--border)); }
        .banner-critical { background: color-mix(in oklab, var(--status-critical) 8%, var(--surface-1)); border-color: color-mix(in oklab, var(--status-critical) 30%, var(--border)); }
        .banner-info { background: var(--surface-1); }
        .banner strong { font-weight: 600; }

        .skeleton { height: 13px; border-radius: 4px; background: linear-gradient(90deg, var(--gridline), color-mix(in oklab, var(--gridline) 40%, var(--surface-1)), var(--gridline)); background-size: 200% 100%; animation: sk 1.2s ease-in-out infinite; }
        @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* ── Tabs / toolbar ────────────────────────────────────────────────────────────────── */
        .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .tabs { display: inline-flex; gap: 2px; background: color-mix(in oklab, var(--ink-primary) 5%, transparent); padding: 2px; border-radius: 8px; }
        .tab { font: inherit; font-size: 13px; border: none; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--ink-secondary); }
        .tab[aria-selected="true"] { background: var(--surface-1); color: var(--ink-primary); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06); }
        select, input[type="text"] { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-1); color: var(--ink-primary); }
        .spacer { flex: 1; }
        .pager { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--gridline); color: var(--ink-secondary); font-size: 12px; }

        /* ── Detail drawer ──────────────────────────────────────────────────────────────────
           A drawer rather than a modal: triaging dead letters means stepping through messages one
           after another, and a modal forces a close/reopen cycle per message. The table stays
           visible and the drawer just re-renders.                                                */
        .scrim {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.32);
            opacity: 0; pointer-events: none; transition: opacity 0.15s ease; z-index: 50;
        }
        .scrim.is-open { opacity: 1; pointer-events: auto; }

        .drawer {
            position: fixed; top: 0; right: 0; height: 100vh; width: 580px; max-width: 92vw;
            background: var(--surface-1); border-left: 1px solid var(--border);
            transform: translateX(100%); transition: transform 0.18s ease; z-index: 51;
            display: flex; flex-direction: column;
        }
        .drawer.is-open { transform: none; }

        .drawer-head { padding: 14px 16px; border-bottom: 1px solid var(--gridline); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .drawer-title { font-weight: 600; }
        .drawer-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
        .drawer-foot { padding: 12px 16px; border-top: 1px solid var(--gridline); display: flex; gap: 8px; align-items: center; }
        .drawer-sub { color: var(--ink-muted); font-size: 12px; margin-top: 2px; }

        .code {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 12px; line-height: 1.55;
            white-space: pre-wrap; word-break: break-word;
            background: var(--page); border: 1px solid var(--gridline); border-radius: 6px;
            padding: 10px 12px; max-height: 300px; overflow: auto; margin: 0;
        }

        .code.is-trace {
            white-space: pre;
            word-break: normal;
            overflow-x: auto;
            max-height: 240px;
        }

        .field { margin-bottom: 14px; }
        .field-label { font-size: 12px; color: var(--ink-secondary); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
        .field-actions { display: flex; gap: 6px; }

        /* Entry id doubles as the affordance that opens the drawer — a real button, so it is
           keyboard reachable rather than relying on the row click alone. */
        .link {
            background: none; border: none; padding: 0; font: inherit;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
            color: var(--accent); cursor: pointer; text-align: left;
        }
        .link:hover { text-decoration: underline; }

        tbody tr.is-selected { background: color-mix(in oklab, var(--accent) 9%, transparent); }

        /* ── Error & loading states ─────────────────────────────────────────────────────────
           Rendered inside the card whose fetch failed, so one failing panel never blanks the page. */
        .state { padding: 24px 14px; text-align: center; }
        .state-icon { font-size: 20px; line-height: 1; margin-bottom: 6px; }
        .state-title { font-weight: 600; margin-bottom: 3px; }
        .state-detail { color: var(--ink-secondary); font-size: 13px; max-width: 460px; margin: 0 auto; }
        .state-actions { margin-top: 12px; display: flex; gap: 8px; justify-content: center; }
        .state-401 .state-icon, .state-403 .state-icon { color: var(--status-warning); }
        .state-5xx .state-icon { color: var(--status-critical); }

        .sk-row { display: flex; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--gridline); }
        .sk-row:last-child { border-bottom: none; }

        /* ── Dialog — a modal IS right here: a destructive confirm must block. ──────────────── */
        .modal-scrim {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.42);
            opacity: 0; pointer-events: none; transition: opacity 0.12s ease; z-index: 60;
        }
        .modal-scrim.is-open { opacity: 1; pointer-events: auto; }

        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -48%) scale(0.99);
            width: 460px; max-width: 92vw; z-index: 61;
            background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
            opacity: 0; pointer-events: none; transition: opacity 0.12s ease, transform 0.12s ease;
        }
        .modal.is-open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
        .modal-head { padding: 14px 16px 0; font-weight: 600; }
        .modal-body { padding: 8px 16px 14px; color: var(--ink-secondary); font-size: 13px; }
        .modal-foot { padding: 12px 16px; border-top: 1px solid var(--gridline); display: flex; gap: 8px; justify-content: flex-end; }
        .modal-body label { display: block; color: var(--ink-primary); margin: 12px 0 4px; font-size: 12px; }
        .modal-body input[type="text"], .modal-body select { width: 100%; }
        .btn-solid-danger {
            background: var(--status-critical); border-color: var(--status-critical); color: #fff;
        }
        .btn-solid-danger:hover { filter: brightness(0.94); background: var(--status-critical); }
        .btn-solid-danger:disabled { opacity: 0.4; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
        .swatch-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

        .section { display: none; }
        .section.is-active { display: block; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
        h3.sub { font-size: 13px; margin: 0 0 8px; color: var(--ink-secondary); font-weight: 500; }
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="brand">
        <div class="brand-name">Essentials Admin</div>
        <div class="brand-sub">orders-service · prod</div>
    </div>

    <nav class="nav" id="nav">
        <div class="nav-group">Overview</div>
        <button class="nav-item" data-view="overview" aria-current="page"><span class="ic">◫</span> Dashboard</button>

        <div class="nav-group" style="margin-top:12px">Infrastructure</div>
        <button class="nav-item" data-view="locks"><span class="ic">▣</span> Fenced locks</button>
        <button class="nav-item" data-view="queues"><span class="ic">≡</span> Durable queues</button>
        <button class="nav-item" data-view="scheduler"><span class="ic">◷</span> Scheduler</button>

        <div class="nav-group" style="margin-top:12px">Event store</div>
        <button class="nav-item" data-view="subscriptions"><span class="ic">↻</span> Subscriptions</button>
        <button class="nav-item" data-view="cdc"><span class="ic">⇄</span> CDC</button>
        <button class="nav-item" data-view="postgresql"><span class="ic">▤</span> PostgreSQL stats</button>

        <div class="nav-group" style="margin-top:12px">Mockup only</div>
        <button class="nav-item" data-view="states"><span class="ic">◈</span> Component states</button>
    </nav>

    <div class="sidebar-footer">
        Signed in as <strong>ops@trustworks.dk</strong><br>
        <span class="nil">essentials_admin</span>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <div>
            <h1 class="page-title" id="pageTitle">Dashboard</h1>
            <p class="page-sub" id="pageSub">Current state of the Essentials infrastructure</p>
        </div>
        <div class="topbar-right">
            <span class="chip" id="stamp">updated 12:04:31</span>
            <button class="btn btn-sm" id="refreshBtn">Refresh</button>
            <button class="btn btn-sm" id="themeBtn">Dark</button>
        </div>
    </div>

    <section class="section is-active" data-section="overview"></section>
    <section class="section" data-section="locks"></section>

const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n = (v) => v == null ? nil() : Number(v).toLocaleString('en-US');
const nil = (t = '—') => `<span class="nil" title="not set">${t}</span>`;
const ts = (v) => v == null ? nil() : esc(String(v).replace('T', ' ').replace('Z', ''));
const epoch = (ms) => ms == null ? nil() : ts(new Date(ms).toISOString().slice(0, 19));

/* Status is icon + label + colour — never colour alone. */
function badge(kind, label, icon) {
  const icons = { good: '●', warning: '▲', serious: '▲', critical: '■', neutral: '○' };
  return `<span class="badge badge-${kind}"><span class="dot" aria-hidden="true">${icon || icons[kind]}</span>${esc(label)}</span>`;
}

/* Inline sequential bar + the number itself (relief rule: the bar is never the sole carrier). */
function bar(value, max, formatted) {
  const pct = max > 0 ? Math.max(2, Math.round((value / max) * 100)) : 0;
  return `<div class="bar-cell"><span class="bar-num">${formatted}</span>
            <span class="bar-track" role="img" aria-label="${formatted}"><span class="bar-fill" style="width:${pct}%"></span></span></div>`;
}

function table(cols, rows, opts = {}) {
  if (!rows.length) {
    return `<div class="empty"><div class="empty-icon" aria-hidden="true">◌</div>
              <div>${esc(opts.empty || 'Nothing to show')}</div></div>`;
  }
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c =>
    `<th${c.sticky ? ' class="sticky"' : (c.num ? ' class="num"' : '')}${c.width ? ` style="width:${c.width}"` : ''}>${esc(c.label)}</th>`).join('')}</tr></thead>
    <tbody>${rows.join('')}</tbody></table></div>`;
}

function card(title, body, note, flush) {
  return `<div class="card"><div class="card-head"><span class="card-title">${esc(title)}</span>
            ${note ? `<span class="card-note">${note}</span>` : ''}</div>
          <div class="card-body${flush ? ' flush' : ''}">${body}</div></div>`;
}

function tile(label, value, sub, critical) {
  return `<div class="tile"><div class="tile-label">${esc(label)}</div>
            <div class="tile-value${critical ? ' is-critical' : ''}">${value}</div>
            ${sub ? `<div class="tile-sub">${sub}</div>` : ''}</div>`;
}

/* ══════════════════════════════════════════════════════════════════════════════════════════
   States — every non-happy path a card can be in
   ══════════════════════════════════════════════════════════════════════════════════════════ */

/*
 * Modelled on the contract's Error schema: `status` and `error` are required, `message` is nullable.
 * The adapter deliberately omits `message` on 5xx so internal detail cannot leak to an HTTP caller,
 * so the 500 state must read sensibly with nothing but a status.
 */
function errorState(err) {
  const map = {
    401: { cls: 'state-401', icon: '▲', title: 'Not signed in',
           detail: 'The request was not authenticated. The host application decides how callers sign in — this panel will populate once a principal is resolved.' },
    403: { cls: 'state-403', icon: '▲', title: 'Not permitted',
           detail: 'Your roles do not cover this operation. Ask an administrator for the role named below, or use an account holding <code class="mono">essentials_admin</code>.' },
    500: { cls: 'state-5xx', icon: '■', title: 'Server error',
           detail: 'The server failed to answer. No detail is returned on a 5xx by design — check the application logs for the corresponding stack trace.' },
    0:   { cls: 'state-5xx', icon: '■', title: 'Cannot reach the server',
           detail: 'The request did not complete. The service may be restarting, or a gateway between you and it is down.' }
  };
  const m = map[err.status] ?? map[500];
  return `<div class="state ${m.cls}">
      <div class="state-icon" aria-hidden="true">${m.icon}</div>
      <div class="state-title">${err.status ? err.status + ' · ' : ''}${esc(m.title)}</div>
      <div class="state-detail">${m.detail}${err.message ? `<br><span class="mono" style="font-size:12px">${esc(err.message)}</span>` : ''}</div>
      <div class="state-actions">
        <button class="btn btn-sm">Retry</button>
        ${err.status === 403 ? '<span class="chip">requires essentials_queue_reader</span>' : ''}
      </div>
    </div>`;
}

function loadingRows(count, widths) {
  return Array.from({ length: count }, () =>
    `<div class="sk-row">${widths.map(w => `<span class="skeleton" style="width:${w}"></span>`).join('')}</div>`).join('');
}

/* ══════════════════════════════════════════════════════════════════════════════════════════
   Dialogs — destructive actions confirm before acting
   ══════════════════════════════════════════════════════════════════════════════════════════ */
let dialogConfirm = null;

function openDialog(opts) {
  const { title, body, confirmLabel, danger, requireText } = opts;
  dialogConfirm = opts.onConfirm ?? null;

  document.getElementById('modal').innerHTML = `
    <div class="modal-head" id="modalTitle">${esc(title)}</div>
    <div class="modal-body">
      ${body}
      ${requireText ? `<label for="confirmText">Type <strong>${esc(requireText)}</strong> to confirm</label>
        <input type="text" id="confirmText" autocomplete="off" spellcheck="false">` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn btn-sm" id="dialogCancel">Cancel</button>
      <button class="btn btn-sm ${danger ? 'btn-solid-danger' : ''}" id="dialogConfirm" ${requireText ? 'disabled' : ''}>${esc(confirmLabel)}</button>
    </div>`;

  document.getElementById('modal').classList.add('is-open');
  document.getElementById('modalScrim').classList.add('is-open');

  if (requireText) {
    const input = document.getElementById('confirmText');
    input.addEventListener('input', () => {
      document.getElementById('dialogConfirm').disabled = input.value !== requireText;
    });
    input.focus();
  } else {
    /* Cancel takes focus on a destructive dialog — the safe option should be the default one. */
    document.getElementById(danger ? 'dialogCancel' : 'dialogConfirm').focus();
  }
}

function closeDialog() {
  document.getElementById('modal').classList.remove('is-open');
  document.getElementById('modalScrim').classList.remove('is-open');
  dialogConfirm = null;
}

document.addEventListener('click', (e) => {
  if (e.target.closest('#dialogCancel') || e.target.closest('#modalScrim')) { closeDialog(); return; }
  if (e.target.closest('#dialogConfirm')) {
    const fn = dialogConfirm;
    closeDialog();
    fn?.();
  }
});

/* ══════════════════════════════════════════════════════════════════════════════════════════
   Message detail drawer — backs GET /durable-queues/messages/{queueEntryId}
   ══════════════════════════════════════════════════════════════════════════════════════════ */

/* payload is a String in the contract, not necessarily JSON. Pretty-print when it parses, show it
   verbatim when it does not — never assume a format the contract does not promise. */
function formatPayload(raw) {
  try {
    return { text: JSON.stringify(JSON.parse(raw), null, 2), kind: 'JSON' };
  } catch {
    return { text: raw, kind: 'text' };
  }
}

function byteLength(str) {
  return new TextEncoder().encode(str).length;
}

function findMessage(id) {
  return fx.queued.find(m => m.id === id) || fx.deadLetters.find(m => m.id === id);
}

function payloadField(m) {
  if (m.payload == null) {
    /* Null by design, not an error — name the role so the reader knows what to ask for. */
    return `<div class="field">
        <div class="field-label"><span>Payload</span><span class="nil">not returned</span></div>
        <div class="banner banner-info" style="margin:0">
          <span aria-hidden="true">ℹ</span>
          <div>The payload is withheld because the signed-in caller does not hold
          <code class="mono">essentials_queue_payload_reader</code> or
          <code class="mono">essentials_admin</code>. Every other field on the message is still readable.</div>
        </div>
      </div>`;
  }
  const p = formatPayload(m.payload);
  return `<div class="field">
      <div class="field-label">
        <span>Payload <span class="nil">· ${p.kind} · ${byteLength(m.payload)} bytes</span></span>
        <span class="field-actions"><button class="btn btn-sm" data-copy="${esc(m.id)}">Copy</button></span>
      </div>
      <pre class="code" id="payloadCode">${esc(p.text)}</pre>
    </div>`;
}

function openDrawer(id) {
  const m = findMessage(id);
  if (!m) return;

  const state = m.isBeingDelivered ? badge('warning', 'Delivering')
              : (m.isDeadLetterMessage ? badge('critical', 'Dead letter') : badge('neutral', 'Queued'));

  const kvItem = (k, v) => `<div class="kv-item"><span class="kv-key">${esc(k)}</span><span class="kv-val">${v}</span></div>`;

  document.getElementById('drawer').innerHTML = `
    <div class="drawer-head">
      <div>
        <div class="drawer-title" id="drawerTitle">Message detail ${state}</div>
        <div class="drawer-sub mono">${esc(m.id)}</div>
      </div>
      <button class="btn btn-sm" id="drawerClose" aria-label="Close">Close</button>
    </div>

    <div class="drawer-body">
      ${payloadField(m)}

      ${m.lastDeliveryError ? `<div class="field">
        <div class="field-label"><span>Last delivery error</span></div>
        <pre class="code is-trace">${esc(m.lastDeliveryError)}</pre>
      </div>` : ''}

      <div class="field">
        <div class="field-label"><span>Delivery</span></div>
        <div class="kv" style="grid-template-columns:1fr">
          ${kvItem('queueName', esc(m.queueName))}
          ${kvItem('addedTimestamp', ts(m.addedTimestamp))}
          ${kvItem('nextDeliveryTimestamp', ts(m.nextDeliveryTimestamp))}
          ${kvItem('deliveryTimestamp', ts(m.deliveryTimestamp))}
          ${kvItem('totalDeliveryAttempts', m.totalDeliveryAttempts)}
          ${kvItem('redeliveryAttempts', m.redeliveryAttempts)}
          ${kvItem('isDeadLetterMessage', m.isDeadLetterMessage ? 'true' : 'false')}
          ${kvItem('isBeingDelivered', m.isBeingDelivered ? 'true' : 'false')}
        </div>
      </div>
    </div>

    <div class="drawer-foot">
      ${m.isDeadLetterMessage
        ? `<button class="btn btn-sm" data-act="resurrect" data-name="${esc(m.id)}">Resurrect…</button>`
        : `<button class="btn btn-sm" data-act="dlq" data-name="${esc(m.id)}">Mark as dead letter</button>`}
      <div class="spacer"></div>
      <button class="btn btn-sm btn-danger" data-act="delete" data-name="${esc(m.id)}">Delete message</button>
    </div>`;

  document.getElementById('drawer').classList.add('is-open');
  document.getElementById('scrim').classList.add('is-open');
  document.querySelectorAll('tbody tr[data-msg]').forEach(tr =>
    tr.classList.toggle('is-selected', tr.dataset.msg === id));
  document.getElementById('drawerClose').focus();
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('is-open');
  document.getElementById('scrim').classList.remove('is-open');
  document.querySelectorAll('tbody tr.is-selected').forEach(tr => tr.classList.remove('is-selected'));
}

document.addEventListener('click', (e) => {
  if (e.target.closest('#drawerClose') || e.target.closest('#scrim')) { closeDrawer(); return; }

  const copy = e.target.closest('[data-copy]');
  if (copy) {
    const m = findMessage(copy.dataset.copy);
    navigator.clipboard?.writeText(m.payload).catch(() => {});
    copy.textContent = 'Copied';
    setTimeout(() => { copy.textContent = 'Copy'; }, 1200);
    return;
  }

  /* Explicit affordance, or anywhere on the row except the action buttons. */
  const trigger = e.target.closest('[data-msg]');
  if (trigger && !e.target.closest('.actions')) openDrawer(trigger.dataset.msg);
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  /* Innermost layer first: a dialog over the drawer must not close both at once. */
  if (document.getElementById('modal').classList.contains('is-open')) closeDialog();
  else closeDrawer();
});

      ${card('403 · missing role', errorState({ status: 403, message: 'Unauthorized access required role is missing, expected \'essentials_queue_reader,essentials_admin\'' }), 'Error.message present', true)}
      ${card('500 · server error', errorState({ status: 500 }), 'Error.message absent by design', true)}
      ${card('Unreachable', errorState({ status: 0 }), 'request never completed', true)}
    </div>

    ${card('Status badges', `<div class="swatch-row">
        ${badge('good', 'Held')} ${badge('good', 'Active')} ${badge('good', 'Succeeded')}
        ${badge('neutral', 'Free')} ${badge('neutral', 'Queued')} ${badge('neutral', 'Paused')}
        ${badge('warning', 'Delivering')} ${badge('warning', 'low')}
        ${badge('serious', 'Connection reset by peer')}
        ${badge('critical', 'Dead letter')} ${badge('critical', 'Failed')}
      </div>
      <p class="card-note" style="margin:10px 0 0">Every badge carries an icon and a label, so colour is never
      the only signal. Status hues are reserved and never reused as series colours.</p>`)}

    <div class="gallery-grid">
      ${card('Stat tiles', `<div class="kpi-row" style="margin:0">
          ${tile('Queued', '128')}
          ${tile('Dead letters', '3', 'needs attention', true)}
          ${tile('Avg latency', '34 <span class="tile-sub" style="font-size:13px">ms</span>')}
        </div>`)}

      ${card('Meters and bars', `
        <div class="meter-row"><span class="mono">orders_events</span>
          <span class="meter-track"><span class="meter-fill" style="width:99%"></span></span>
          <span class="meter-val">99%</span></div>
        <div class="meter-row"><span class="mono">eventstore_cdc_inbox ${badge('warning', 'low')}</span>
          <span class="meter-track"><span class="meter-fill" style="width:71%"></span></span>
          <span class="meter-val">71%</span></div>
        <div style="margin-top:12px">${bar(2.02, 2.38, '2.02 ms')}</div>
        <div>${bar(0.10, 2.38, '0.10 ms')}</div>`)}
    </div>

    ${card('Destructive confirmations', `<div class="swatch-row">
        <button class="btn btn-sm btn-danger" data-act="release" data-name="EventProcessor-OrderProcessor">Release lock…</button>
        <button class="btn btn-sm" data-act="dlq" data-name="018f2c11-9a1e-7c3d-b0f1-2a5c9e11aa01">Mark as dead letter…</button>
        <button class="btn btn-sm" data-act="resurrect" data-name="018f2b04-51cc-7a10-9d22-71bb0e77dd10">Resurrect…</button>
        <button class="btn btn-sm btn-danger" data-act="delete" data-name="018f2c11-9a1e-7c3d-b0f1-2a5c9e11aa01">Delete message…</button>
        <button class="btn btn-sm btn-danger" data-act="purge" data-name="OrderEvents">Purge queue…</button>
      </div>
      <p class="card-note" style="margin:10px 0 0">Cancel holds focus on a destructive dialog. Purge additionally
      requires the queue name to be typed — it is the only irreversible bulk operation in the contract.</p>`)}`;

/* ══════════════════════════════════════════════════════════════════════════════════════════
   Wiring
   ══════════════════════════════════════════════════════════════════════════════════════════ */
const titles = {
  overview: ['Dashboard', 'Current state of the Essentials infrastructure'],
  locks: ['Fenced locks', 'Distributed locks held across service instances'],
  queues: ['Durable queues', 'Queued and dead-letter messages, delivery statistics'],
  scheduler: ['Scheduler', 'pg_cron jobs, run history and executor jobs'],
  subscriptions: ['Subscriptions', 'Event-store subscription resume points'],
  cdc: ['Change Data Capture', 'Replication slot, tailer and dispatcher state'],
  postgresql: ['PostgreSQL statistics', 'Query, size, activity and cache statistics'],
  states: ['Component states', 'Mockup-only gallery of every component and state']
};

function show(view) {
  document.querySelectorAll('.nav-item').forEach(b =>
    b.getAttribute('data-view') === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('is-active', s.dataset.section === view));

  const host = document.querySelector(`.section[data-section="${view}"]`);
  if (!host.dataset.rendered) { host.innerHTML = views[view](); host.dataset.rendered = '1'; }

  document.getElementById('pageTitle').textContent = titles[view][0];
  document.getElementById('pageSub').textContent = titles[view][1];
}

document.getElementById('nav').addEventListener('click', (e) => {
  const b = e.target.closest('.nav-item');
  if (b && !b.disabled) show(b.dataset.view);
});

/* Queued / dead-letter tabs */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-qtab]');
  if (t) {
    document.querySelectorAll('[data-qtab]').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    document.getElementById('qQueued').style.display = t.dataset.qtab === 'queued' ? '' : 'none';
    document.getElementById('qDead').style.display = t.dataset.qtab === 'dead' ? '' : 'none';
  }

  /* On-demand highest global order — one call per click, never eagerly */
  const hi = e.target.closest('[data-hi]');
  if (hi) {
    const cell = document.getElementById('hi' + hi.dataset.hi);
    cell.innerHTML = '<span class="skeleton" style="display:inline-block;width:64px"></span>';
    setTimeout(() => { cell.textContent = n(fx.highestGlobalOrder[hi.dataset.agg]); }, 550);
  }
});

const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  themeBtn.textContent = dark ? 'Dark' : 'Light';
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  /* Show the skeleton where the data will land, then re-render — the same shape a real fetch takes. */
  const host = document.querySelector('.section.is-active');
  const view = host.dataset.section;
  host.querySelectorAll('.card-body').forEach(b => { b.innerHTML = loadingRows(3, ['28%', '20%', '24%', '12%']); });
  setTimeout(() => { host.innerHTML = views[view](); }, 700);
});

show('overview');
</script>
</body>
</html>
